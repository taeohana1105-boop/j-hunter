<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J Hunter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0F13">
<title>J Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F13;--panel:#1A1C23;--panel2:#22252E;--ink:#F3EDE2;--muted:#8A8F9C;--line:rgba(201,164,92,.16);--red:#B3263A;--gold:#C9A45C;--gold2:#E8CF8E;--hot:255,138,61;--glass-edge:rgba(201,164,92,.28);
--display:"Noto Serif Thai","IBM Plex Sans Thai",Georgia,serif;--num:"Inter","IBM Plex Sans Thai",system-ui,sans-serif;--body:"IBM Plex Sans Thai",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:1000px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 48px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;background:linear-gradient(#F4E2B0,#C9A45C);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:3px;color:var(--gold);-webkit-text-fill-color:var(--gold)}
.sub{color:var(--muted);font-size:12px}
h3{font-family:var(--display);font-size:15px;color:var(--gold2);margin:24px 0 10px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}
.num{font-family:var(--num)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);font-size:14px;padding:10px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;min-height:42px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.gold{background:var(--gold);color:#14151A;border:0}
.btn.red{border-color:rgba(179,38,58,.5);color:#E8798A}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.click{cursor:pointer;width:100%;text-align:left}
.card .t{font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);margin-left:6px;white-space:nowrap}
.progress{height:4px;border-radius:9px;background:var(--panel2);overflow:hidden;margin:8px 0 6px}
.progress i{display:block;height:100%;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--num);font-size:22px;color:var(--gold2)}
.stat span{font-size:11px;color:var(--muted)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ===== กล่องซองแบบ LastOne ===== */
.boxes{display:flex;flex-direction:column;align-items:center;gap:18px;margin:6px 0 14px}
.bwrap{width:100%;max-width:640px}
.heat{display:flex;align-items:flex-end;height:38px;margin:0 5%;gap:0}
.hb{flex:1 1 0;min-width:0;height:var(--v);margin:0 .5px;border-radius:2px 2px 0 0;background:linear-gradient(rgb(var(--hot)),rgba(var(--hot),.25));opacity:calc(.25 + var(--v-n)*.75)}
.hb.z{background:transparent}
.hb.hit{height:9px;width:9px;flex:0 0 auto;margin:0 -4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4D6,#E8CF8E 40%,#9C7A36);opacity:1;z-index:2;align-self:flex-end;position:relative;top:-2px}
.box{position:relative;width:100%;aspect-ratio:2.5/1}
.box .tray{pointer-events:none;position:absolute;inset:10% 3% 0;border-radius:8px;background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.03));border:1.5px solid var(--glass-edge);box-shadow:0 18px 26px -18px rgba(0,0,0,.8)}
.box .slices{position:absolute;left:5%;right:5%;bottom:7%;height:80%;display:flex;align-items:flex-end}
.box .front{pointer-events:none;position:absolute;inset:46% 3% 0;border-radius:0 0 8px 8px;background:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,.09));border:1px solid var(--glass-edge);border-top:1px solid rgba(255,255,255,.35);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px)}
.box .tag{pointer-events:none;position:absolute;left:50%;top:64%;transform:translateX(-50%);background:#121318;color:var(--gold2);border:1px solid var(--gold);border-radius:4px;padding:3px 12px;font-family:var(--num);font-weight:700;font-size:clamp(.8rem,2.6vw,1.05rem);white-space:nowrap}
.box .box-no{position:absolute;left:10px;top:4px;font-size:11px;color:var(--muted);font-family:var(--num)}
.sl{flex:1 1 0;min-width:0;height:100%;position:relative;cursor:pointer;border-radius:2px 2px 0 0;background:linear-gradient(90deg,#4A0D16,#B02A40 45%,#5C1220);border-left:1px solid rgba(255,200,200,.14);transition:height .2s cubic-bezier(.3,1.5,.5,1),filter .2s}
.sl::before{content:"";position:absolute;left:0;right:0;top:0;height:5%;min-height:3px;border-radius:2px 2px 0 0;background:linear-gradient(#E8798A,#7A1626)}
@media(hover:hover){.sl:hover{height:118%;filter:brightness(1.5);z-index:2}}
.sl.hot{box-shadow:0 0 calc(var(--h)*10px) rgba(var(--hot),calc(var(--h)*.9))}
.sl.sel{height:120%;z-index:3;background:linear-gradient(90deg,#7A5C22,#F4E2B0 45%,#9C7A36);box-shadow:0 0 12px rgba(232,207,142,.6)}
.sl.sel::before{background:linear-gradient(#FFF4D6,#D9A93A)}
.dv{flex:0 0 3px;align-self:stretch;margin:0 1px;height:112%;position:relative;top:-6%;border-radius:2px;background:linear-gradient(#F4E2B0,#9C7A36);opacity:.85;pointer-events:none}
.hdv{flex:0 0 5px}
.slg{flex:1 1 0;min-width:0;height:12%;margin:0 .5px;border-radius:2px 2px 0 0;background:rgba(255,255,255,.07);cursor:pointer}
.slg.hit{height:26%;background:linear-gradient(#E8CF8E,#7A5C22)}
.slg.sel{outline:2px solid var(--gold2)}

/* ตัวเลือกตำแหน่ง */
.pos-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;max-width:780px;margin:0 auto}
.pos-pick input{width:84px;text-align:center;font-family:var(--num);font-weight:700;font-size:20px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button,.btn{-webkit-user-select:none;user-select:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-weight:600;color:var(--muted);min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#14151A}
.rec{max-width:780px;margin:12px auto 0;background:linear-gradient(160deg,rgba(201,164,92,.12),rgba(201,164,92,.03));border:1px solid var(--gold);border-radius:14px;padding:14px}
.rec .where{font-family:var(--display);font-size:18px;color:var(--gold2)}
.rec .orig{font-size:12px;color:var(--muted)}
.hitbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}
.hitbtns .btn{flex-direction:column;gap:0;border-color:rgba(201,164,92,.45);color:var(--gold2);padding:6px}
.hitbtns .btn small{font-size:10px;color:var(--muted);font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitbtns .btn.cur{background:rgba(201,164,92,.25)}

.play{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px;align-items:start}
@media(max-width:900px){.play{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:620px;overflow:auto}
.side h4{margin:0 0 8px;font-family:var(--display);color:var(--gold2);font-weight:600}
.side ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
@media(max-width:900px){.side{max-height:none}.side ol{flex-direction:row;flex-wrap:wrap}}
.side li{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 8px;border-radius:8px;background:var(--panel2);cursor:pointer;font-family:var(--num)}
.side li.hit{background:rgba(201,164,92,.18);color:var(--gold2)}
.side li i{font-style:normal;color:var(--muted);font-size:11px}

.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--panel2);border:1px solid rgba(var(--hot),.6);color:#FFB48C;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:var(--num)}
.list div{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.list div:last-child{border:0}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.in{font-size:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .seg{flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:10;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h2{margin:0 0 4px;font-family:var(--display);color:var(--gold2);font-size:20px}
.segT{display:flex;gap:6px}.segT button{flex:1}
.segT .btn.on{border-color:var(--gold);color:var(--gold2)}
.refill-bar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:-4px auto 10px}
.refill-bar .seg button{min-height:32px;padding:4px 12px}
.refill-bar input{width:60px;text-align:center;font-family:var(--num);font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px}
.bc-odds{display:flex;gap:14px;text-align:right}
.bc-odds div{display:flex;flex-direction:column}
.bc-odds b{font-family:var(--num);font-size:18px;color:var(--ink)}
.bc-odds .hi b{font-size:22px;color:var(--gold2)}
.bc-odds span{font-size:11px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
:root{color-scheme:dark}
.sync{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync:empty{display:none}
.sync.ok{border-color:rgba(46,139,110,.6);color:#7FD3B4}
.sync.busy{border-color:var(--gold);color:var(--gold2)}
.lvl{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.lvl-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl-top .pill{margin:0}
.lvl-name{font-family:var(--display);font-size:20px;color:var(--gold2);margin:4px 0 8px}
.lv-off .lvl-name,.lv-none .lvl-name{color:var(--ink)}
.lv-high{border-color:rgba(var(--hot),.6)}
.meter{position:relative;height:8px;border-radius:9px;background:linear-gradient(90deg,#3a3d47 0 20%,#6b5a33 20% 42%,#a9802f 42% 68%,rgb(var(--hot)) 68%)}
.meter span{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--gold)}
.meter-lbl{display:grid;grid-template-columns:20% 22% 26% 32%;font-size:11px;color:var(--muted);margin-top:4px}
.meter-lbl span{text-align:center}
.lvl-adv{margin-top:8px;line-height:1.55}
.recdot{color:var(--gold2)}
.why{margin-top:4px}
.why summary{cursor:pointer;font-size:12px;color:var(--gold);list-style:none;display:inline-block}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"▸ ";}
.why[open] summary::before{content:"▾ ";}
.why ul{margin:6px 0 2px;padding-left:18px;font-size:13px;line-height:1.6;color:var(--ink)}
.why li{margin-bottom:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:4px}
.legend em{display:inline-block;width:8px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:5px}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='jhunter.v1', PER=100;
let S=load();
const UI={sel:null,side:'L',box:0};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.boards))return s}catch(e){}return{boards:[],cur:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof scheduleSync==='function')scheduleSync()}
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(3,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>(v*100).toFixed(v<0.1?1:0)+'%';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const getB=id=>S.boards.find(b=>b.id===id);
const hitName=(b,n)=>pad(n)+(b.labels&&b.labels[n-1]?' '+b.labels[n-1]:'');
function seqOf(b){
  if(!Array.isArray(b.seq))b.seq=[];
  // เก็บกวาดข้อมูลจากเวอร์ชันเก่า: ตัดรายการที่ไม่มีซองจริง และเติมซองที่เปิดแล้วแต่ตกหล่น
  const ok=b.seq.filter((x,i,a)=>b.opened[x]&&a.indexOf(x)===i);
  Object.keys(b.opened).map(Number).forEach(x=>{if(!ok.includes(x))ok.push(x)});
  if(ok.length!==b.seq.length||ok.some((x,i)=>x!==b.seq[i]))b.seq=ok;
  return b.seq;
}

/* ===== ค่าของซอง: เลขที่ออก (ฮิต = 1..hitCount, เกลือ = hitCount+1..total) ===== */
function val(o){if(!o)return null;if(o.v!==undefined)return o.v;if(o.type==='hit')return o.hit;return null}
const isHitV=(b,v)=>v!=null&&v<=b.hitCount;
function obsOf(b){return Object.entries(b.opened).map(([k,o])=>({pos:+k,v:val(o)})).filter(o=>o.v!=null)}
function foundHits(b){return obsOf(b).filter(o=>o.v<=b.hitCount).map(o=>({n:o.v,pos:o.pos}))}
function usedNums(b){return new Map(obsOf(b).map(o=>[o.v,o.pos]))}
function numLabel(b,v){return v==null?'เกลือ (ไม่รู้เลข)':isHitV(b,v)?'★ '+pad(v):pad(v)}

/* ===== กล่อง / นับตำแหน่ง ===== */
function boxes(b){const n=Math.ceil(b.total/PER),per=Math.ceil(b.total/n);return Array.from({length:n},(_,i)=>({i,from:i*per+1,to:Math.min(b.total,(i+1)*per)}))}
function boxOf(b,x){return boxes(b).find(bx=>x>=bx.from&&x<=bx.to)}
/* ลำดับซองจริงในกล่องตอนนี้ (เก็บเป็นตำแหน่งเดิมของซอง)
   โหมดเติมซอง: หยิบซองออกแล้วร้านเอาซองขวาสุดของกล่องมาเติมให้ช่อง (กระดาษกั้น) เต็มเหมือนเดิม
   คำนวณใหม่จากลำดับที่จดทุกครั้ง จึงแก้/ย้อนกลับได้เสมอ */
let _po={k:null,v:null};
function physOrder(b){
  const seq=seqOf(b),k=[b.id,b.total,b.refill?1:0,b.sec||0,b.refillAt||'gap',seq.join(','),Object.keys(b.opened).join(',')].join('|');
  if(_po.k===k)return _po.v;
  const mv=new Set();
  const BX=boxes(b),arr=BX.map(bx=>{const a=[];for(let x=bx.from;x<=bx.to;x++)a.push(x);return a});
  if(b.refill&&b.sec>0){
    const sec=b.sec;
    seq.forEach(x=>{
      if(!b.opened[x])return;
      const a=arr[BX.findIndex(bx=>x>=bx.from&&x<=bx.to)],i=a.indexOf(x);if(i<0)return;
      a.splice(i,1);
      if(!a.length)return;
      const si=Math.floor(i/sec),sl=Math.floor((a.length-1)/sec);
      if(si<sl){const m=a.pop();mv.add(m);a.splice(b.refillAt==='end'?Math.min(a.length,(si+1)*sec-1):i,0,m)}
    });
  }else arr.forEach((a,i)=>arr[i]=a.filter(x=>!b.opened[x]));
  _po={k,v:arr,mv};return arr;
}
function remainIn(b,bx){return physOrder(b)[bx.i]}
function moved(b,x){physOrder(b);return !!(b.refill&&_po.mv&&_po.mv.has(x))}
function lr(b,x){const bx=boxOf(b,x),r=remainIn(b,bx),k=r.indexOf(x);return{bx,k,L:k+1,R:r.length-k,n:r.length}}
function boxPrefix(b,bx){return boxes(b).length>1?`กล่อง ${bx.i+1} · `:''}

/* ===== วัดความสับ: เลขที่ติดกัน (เช่น 045 กับ 046) อยู่ห่างกันกี่ซอง ===== */
function pairCount(b){
  // ดูทุกคู่ซองที่เลขห่างกันไม่เกิน 5 (เช่น 015 กับ 017): ถ้าตำแหน่งก็ใกล้กัน = ร้านสับไม่ทั่ว
  const o=obsOf(b).sort((a,c)=>a.v-c.v);let n=0,close=0,sk=0,fw=0;const ks=[];
  for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++){
    const dv=o[j].v-o[i].v;if(dv>5)break;const d=o[j].pos-o[i].pos,dp=Math.abs(d);n++;
    if(dp<=3*dv){close++;sk+=dv;if(d>0)fw++;ks.push(dp/dv)}
  }
  return{n,close,sk,fw,ks};
}
function shuffleStats(b,shop){
  const z={n:0,close:0,sk:0,fw:0,ks:[]};
  const cur=b?pairCount(b):z;
  const hist=S.boards.filter(x=>x.shop===(shop||b.shop)&&(b?x.closed&&x.id!==b.id:true)).map(pairCount);
  const t=[cur,...hist].reduce((a,c)=>({n:a.n+c.n,close:a.close+c.close,sk:a.sk+c.sk,fw:a.fw+c.fw,ks:a.ks.concat(c.ks)}),z);
  const ks=t.ks.sort((a,c)=>a-c);
  const step=ks.length>=3?clamp(ks[Math.floor(ks.length/2)],1,3):1;
  return{...t,boards:hist.length,q:(t.sk+1)/(t.sk+(t.n-t.close)+3),fp:(t.fw+1)/(t.close+2),step};
}
function shuffleText(st){
  if(!st.n)return'ยังไม่มีคู่เลขใกล้กัน (เช่น 015 กับ 017) ให้วัด';
  const r=st.q;
  const t=r>=0.6?'สับไม่ทั่วมาก 🔥':r>=0.35?'สับไม่ค่อยทั่ว':r>=0.15?'สับพอใช้':'ใกล้เคียงสุ่มจริง';
  return `คู่เลขใกล้กันที่อยู่ใกล้กันจริง ${st.close}/${st.n} คู่ · ดัชนีสับไม่ทั่ว ${Math.round(r*100)}% — ${t}${st.n<6?' · ข้อมูลยังน้อย':''}`;
}
function params(b){
  const st=shuffleStats(b),m=b.mode||'auto';
  const fixed={low:0.3,mid:0.55,high:0.8}[m];
  if(m==='off')return{q:0,fp:st.fp,step:st.step,st,src:'ปิดการคาดการณ์ (สุ่มล้วน)'};
  if(fixed)return{q:fixed,fp:st.fp,step:st.step,st,src:'ตั้งเอง: '+{low:'ต่ำ',mid:'กลาง',high:'สูง'}[m]};
  return{q:st.q,fp:st.fp,step:st.step,st,src:st.n?`อัตโนมัติจากข้อมูล ${st.n} คู่เลข${st.boards?` (รวม ${st.boards} กระดานเก่าของร้าน)`:''}`:'อัตโนมัติ: ยังไม่มีข้อมูล ใช้ค่าเริ่มต้น'};
}

/* ===== ประเมินระดับการสับจากข้อมูล ===== */
function levelOf(st){
  if(st.n<3||st.close+ (st.n-st.close)<3)return{key:'none',name:'ยังบอกไม่ได้',conf:'ข้อมูลยังน้อย'};
  const q=st.q;
  const conf=st.n>=12?'ค่อนข้างแน่น':st.n>=6?'พอเชื่อได้':'ข้อมูลยังน้อย';
  if(q<0.2)return{key:'off',name:'ใกล้เคียงสุ่ม',conf,q};
  if(q<0.42)return{key:'low',name:'ต่ำ',conf,q};
  if(q<0.68)return{key:'mid',name:'กลาง',conf,q};
  return{key:'high',name:'สูง',conf,q};
}

    mid:'แพทเทิร์นชัดพอสมควร ซองที่แนะนำมีโอกาสติดฮิตสูงกว่าซองทั่วไปจริง',

    <div class="meter-lbl"><span>สุ่ม</span><span>ต่ำ</span><span>กลาง</span><span>สูง</span></div>`}

/* ===== โมเดลคาดการณ์ =====
   เลข u น่าจะอยู่ใกล้ซองที่เปิดแล้วซึ่งมีเลขใกล้ u
   ถ้าเห็นเลข v ที่ตำแหน่ง p → u น่าอยู่ราว p ± (u-v) (ไปทางเดียวกับที่เลขเรียง)
   น้ำหนักลดลงตาม q^|u-v| (q = โอกาสที่เลขติดกันยังอยู่ติดกัน) */
function model(b){
  const N=b.total,P=params(b),obs=obsOf(b);
  const un=[];for(let x=1;x<=N;x++)if(!b.opened[x])un.push(x);
  const used=usedNums(b);
  const unseen=[];for(let u=1;u<=N;u++)if(!used.has(u))unseen.push(u);
  const U=un.length;
  function dist(u){
    const p=new Float64Array(U);
    if(!U)return{p,M:0};
    let M=0;const comps=[];
    if(P.q>0)obs.forEach(o=>{const d=u-o.v,w=Math.pow(P.q,Math.abs(d));if(w<1e-3)return;M=Math.max(M,w);comps.push({w,c1:o.pos+d*P.step,c2:o.pos-d*P.step,s:0.7+0.12*Math.abs(d)*P.step})});
    M=Math.min(0.95,M);
    let tot=0;
    if(comps.length){un.forEach((x,i)=>{let s=0;comps.forEach(c=>{const a=(x-c.c1)/c.s,z=(x-c.c2)/c.s;s+=c.w*(P.fp*Math.exp(-a*a/2)+(1-P.fp)*Math.exp(-z*z/2))});p[i]=s;tot+=s})}
    if(tot<1e-9){p.fill(1/U);return{p,M:0}}
    for(let i=0;i<U;i++)p[i]=M*p[i]/tot+(1-M)/U;
    return{p,M};
  }
  const remHits=unseen.filter(u=>u<=b.hitCount);
  const H=remHits.length,base=U?Math.min(1,H/U):0;
  const miss=new Float64Array(U).fill(1),perHit=[];
  remHits.forEach(u=>{
    const {p,M}=dist(u);let best=0;
    for(let i=0;i<U;i++){miss[i]*=(1-p[i]);if(p[i]>p[best])best=i}
    if(M>0.12){
      let mu=0,sw=0;p.forEach((v,i)=>{const e=v-(1-M)/U;if(e>0){mu+=e*un[i];sw+=e}});mu/=sw;
      let vr=0;p.forEach((v,i)=>{const e=v-(1-M)/U;if(e>0)vr+=e*(un[i]-mu)**2});const sd=Math.sqrt(vr/sw);
      const c=un[best],r=Math.max(1,Math.round(Math.min(sd,N/6)));
      let conf=0;un.forEach((x,i)=>{if(x>=c-r&&x<=c+r)conf+=p[i]});
      const lo=Math.max(1,c-r),hi=Math.min(N,c+r);
      const rangeN=un.filter(x=>x>=lo&&x<=hi).length;
      const clues=obs.map(o=>({v:o.v,pos:o.pos,d:u-o.v,w:Math.pow(P.q,Math.abs(u-o.v))})).filter(o=>o.w>0.03).sort((a,z)=>z.w-a.w).slice(0,2);
      perHit.push({n:u,center:c,lo,hi,conf,rangeN,rnd:rangeN/U,clues});
    }
  });
  const prob={};let mx=0,mn=1;
  un.forEach((x,i)=>{prob[x]=H?1-miss[i]:0;mx=Math.max(mx,prob[x]);mn=Math.min(mn,prob[x])});
  const spread=mx>mn*1.08&&mx>0;
  const top=spread?un.slice().sort((a,c)=>prob[c]-prob[a]).slice(0,6):[];
  function guess(x){ // เลขที่น่าจะอยู่ในซอง x
    const i=un.indexOf(x);if(i<0||!obs.length||P.q<=0)return null;
    const sc=unseen.map(u=>({u,p:dist(u).p[i]})).sort((a,c)=>c.p-a.p);
    const top3=sc.slice(0,3),sum=top3.reduce((a,c)=>a+c.p,0);
    if(top3[0].p<1.5/U)return null;
    return{nums:top3.map(t=>t.u).sort((a,c)=>a-c),sum};
  }
  return{N,H,U,base,prob,mx,mn,spread,top,perHit,P,guess,obsN:obs.length};
}
function rangeText(b,p){
  const bx=boxOf(b,p.center),r=remainIn(b,bx);
  const ks=r.map((x,i)=>x>=p.lo&&x<=p.hi?i:-1).filter(i=>i>=0);
  if(!ks.length)return`${boxPrefix(b,bx)}ตำแหน่งเดิม #${p.lo}–${p.hi}`;
  // รวมเป็นช่วงติดกัน (ซองที่ถูกย้ายมาเติมอาจแยกออกไปอยู่ที่อื่น)
  const runs=[];ks.forEach(k=>{const l=runs[runs.length-1];if(l&&k-l[1]<=1)l[1]=k;else runs.push([k,k])});
  const f=([a,z])=>a===z?`${a+1}`:`${a+1}–${z+1}`, g=([a,z])=>a===z?`${r.length-a}`:`${r.length-z}–${r.length-a}`;
  return `${boxPrefix(b,bx)}ซองที่ <b>${runs.map(f).join(', ')}</b> จากซ้าย <span class="muted">(${runs.slice().reverse().map(g).join(', ')} จากขวา)</span>`;
}
function groupHits(b,list){
  const m=new Map();
  list.forEach(p=>{const t=rangeText(b,p);if(!m.has(t))m.set(t,{ns:[],conf:0,p});const g=m.get(t);g.ns.push(p.n);if(p.conf>g.conf){g.conf=p.conf;g.p=p}});
  return [...m].map(([txt,g])=>({txt,conf:g.conf,p:g.p,names:g.ns.length>2?`${pad(g.ns[0])}–${pad(g.ns[g.ns.length-1])}`:g.ns.map(n=>esc(hitName(b,n))).join(', ')}));
}
/* เหตุผลของตัวเลข “มั่นใจ %” */
function whyHTML(b,p,P){
  const st=P.st,u=p.n,lines=[];
  p.clues.forEach((c,i)=>{
    const ad=Math.abs(c.d),dist=Math.max(1,Math.round(ad*P.step));
    let dir;
    if(st.close>=2&&(P.fp>=0.65||P.fp<=0.35)){
      const right=(c.d>0)===(P.fp>=0.65);
      dir=`ร้านนี้เลขมักเพิ่มขึ้นไปทาง${P.fp>=0.65?'ขวา':'ซ้าย'} ${pad(u)} ${c.d>0?'มากกว่า':'น้อยกว่า'} ${pad(c.v)} จึงน่าอยู่ทาง<b>${right?'ขวา':'ซ้าย'}</b>ของซองนั้นประมาณ ${dist} ซอง`;
    }else dir=`ยังไม่รู้ว่าเลขเรียงไปทางไหน แอปเลยเผื่อไว้ทั้งซ้ายและขวาของซองนั้นประมาณ ${dist} ซอง`;
    lines.push(`${i?'อีกเบาะแส: ':''}เลข <b>${pad(c.v)}</b> ออกที่ซองตำแหน่งเดิม #${c.pos} ซึ่งห่างจาก ${pad(u)} ${ad<=3?'แค่':''} ${ad} เลข · ${dir}`);
  });
  const ratio=p.rnd>0?p.conf/p.rnd:0;
  lines.push(`ถ้าซองเรียงแบบสุ่มล้วน ช่วงนี้ (${p.rangeN} ซอง) จะมีโอกาสแค่ ${pct(p.rnd)} ตอนนี้ ${pct(p.conf)} = <b>สูงกว่าสุ่ม ${ratio.toFixed(1)} เท่า</b>`);
  const lim=[];
  if(st.n<6)lim.push(`ข้อมูลคู่เลขยังน้อย (${st.n} คู่)`);
  if(P.q<0.5)lim.push(`ร้านนี้สับพอใช้ (ดัชนี ${Math.round(P.q*100)}%) เลขที่ใกล้กันไม่ได้อยู่ใกล้กันเสมอ`);
  const best=p.clues[0];if(best&&Math.abs(best.d)>=3)lim.push(`เลขที่ใกล้ที่สุดยังห่างไป ${Math.abs(best.d)} เลข ยิ่งห่างยิ่งเดายาก`);
  if(!(st.close>=2&&(P.fp>=0.65||P.fp<=0.35)))lim.push('ยังไม่รู้ทิศที่เลขเรียง ต้องเผื่อสองข้าง ช่วงเลยกว้าง');
  if(b.refill&&/,/.test(rangeText(b,p)))lim.push('มีซองที่ร้านย้ายมาเติม ช่วงเลยแตกเป็นหลายจุด');
  if(lim.length)lines.push(`ที่ยังไม่สูงกว่านี้เพราะ: ${lim.join(' · ')}`);
  return `<details class="why"><summary>ทำไมมั่นใจ ${pct(p.conf)}?</summary><ul>${lines.map(l=>`<li>${l}</li>`).join('')}</ul></details>`;
}

/* ===== ร้าน ===== */
function shopList(){
  if(!Array.isArray(S.shops))S.shops=[];
  S.boards.forEach(b=>{if(!S.shops.includes(b.shop))S.shops.push(b.shop)});
  return S.shops;
}
function boardChance(b){
  if(b.closed)return null;
  const R=model(b);if(!R.U||!R.H)return{R,best:null};
  const x=R.spread?R.top[0]:null;
  return{R,best:x?{x,p:R.prob[x],lr:lr(b,x)}:null};
}
const pctOr=v=>v==null?'–':pct(v);

function shopCard(shop){
  const bs=S.boards.filter(b=>b.shop===shop),act=bs.filter(b=>!b.closed);
  let top=null;
  act.forEach(b=>{const c=boardChance(b);const p=c&&c.R.U?(c.best?c.best.p:c.R.base):null;if(p!=null&&(!top||p>top.p))top={p,b}});
  const st=shuffleStats(null,shop);
  return `<button class="card click" onclick="openShop(${JSON.stringify(shop).replace(/"/g,'&quot;')})">

    <div class="small muted" style="margin-top:4px">กำลังเล่น ${act.length} กระดาน · ปิดแล้ว ${bs.length-act.length} กระดาน</div>

function saveShop(old){

function boardCard(b,c){
  const f=foundHits(b).length,o=Object.keys(b.opened).length,U=b.total-o,H=b.hitCount-f;
  let right='';
  if(!b.closed&&c&&c.R.U){
    const best=c.best;
    right=`<div class="bc-odds">
      <div><b>${pct(c.R.base)}</b><span>ฮิตเรทตอนนี้</span></div>
      <div class="hi"><b>${best?pct(best.p):pct(c.R.base)}</b><span>${best?`ซองดีสุด · ${boxes(b).length>1?`กล่อง ${best.lr.bx.i+1} `:''}ซ้าย ${best.lr.L} / ขวา ${best.lr.R}`:'ทุกซองเท่ากัน'}</span></div></div>`;
  }
  return `<button class="card click" onclick="openBoard('${b.id}')">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="t">${esc(b.name)}${b.closed?'<span class="pill">ปิดแล้ว</span>':''}</div>

}

function pickRA(el){el.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===el))}
function pickT(v){NB.total=v;$('#nTotal').value=v;markSeg()}

function createBoard(){
  const shop=$('#nShop').value.trim()||'ไม่ระบุร้าน';
  if(!shopList().includes(shop))S.shops.push(shop);S.shopView=shop;
  const total=clamp(parseInt($('#nTotal').value)||100,5,500);
  const hitCount=clamp(parseInt($('#nHits').value)||1,1,Math.min(99,total));
  const labels=$('#nLabels').value.split('\n').map(s=>s.trim()).slice(0,hitCount);
  const name=$('#nName').value.trim()||('กระดาน '+new Date().toLocaleDateString('th-TH'));
  const sec=clamp(parseInt($('#nSec').value)||0,0,100),refill=$('#nRefill').checked&&sec>0;
  const refillAt=document.querySelector('[data-ra][aria-pressed="true"]')?.dataset.ra||'gap';
  const b={id:uid(),shop,name,total,hitCount,labels,sec,refill,refillAt,opened:{},seq:[],log:[],closed:false,mode:'auto',created:Date.now()};
  S.boards.unshift(b);save();closeSheet();openBoard(b.id);

/* ===== หน้ากระดาน ===== */
function openBoard(id){S.cur=id;UI.sel=null;UI.box=0;save();renderBoard('pos')}
function renderBoard(focus){setTimeout(()=>window.paintSync&&paintSync(),0);

  const heatOf=x=>R.spread?(R.prob[x]-R.mn)/(R.mx-R.mn):0;
  const PO=physOrder(b),sec=b.sec||0,DIV='<div class="dv"></div>',HDV='<div class="hdv"></div>';

    const slots=b.refill?PO[bx.i]:Array.from({length:bx.to-bx.from+1},(_,j)=>bx.from+j);
    slots.forEach((x,j)=>{
      if(sec&&j>0&&(b.refill?j%sec===0:(x-bx.from)%sec===0)){sl+=DIV;heat+=HDV}
      const o=b.opened[x],sel=UI.sel===x?' sel':'';

        const v=val(o),h=isHitV(b,v);

      </div>
      ${hb?`<div class="small muted" style="margin-top:10px">ปุ่มลัดฮิต</div><div class="hitbtns">${hb}</div>`:''}</div>`;
  }

  const seq=seqOf(b);
  const hist=seq.map((x,i)=>{const o=b.opened[x];if(!o)return'';const v=val(o);return `<li class="${isHitV(b,v)?'hit':''}" onclick="selPos(${x})"><i>${i+1}.</i>#${x} → ${v==null?'เกลือ':isHitV(b,v)?'★'+pad(v):pad(v)}</li>`}).reverse().join('');
  const modes=[['auto','อัตโนมัติ'],['low','ต่ำ'],['mid','กลาง'],['high','สูง'],['off','ปิด']];
  const chip=x=>{const p=lr(b,x);return `<button class="chip" onclick="selPos(${x})">${boxPrefix(b,p.bx)}ซ้าย ${p.L} / ขวา ${p.R} · ${pct(R.prob[x])}</button>`};
  const groups=groupHits(b,R.perHit);

  app.innerHTML=`
  <header class="top"><div class="row"><button class="btn sm" onclick="openShop(getB(S.cur).shop)">‹ ${esc(b.shop)}</button><button class="btn sm" onclick="openSettings()">⚙︎ ตั้งค่ากล่อง</button></div><div style="text-align:right"><div class="t" style="font-weight:600">${esc(b.name)}</div><div class="sub">${esc(b.shop)} · ฮิต 001–${pad(b.hitCount)} · เกลือ ${pad(b.hitCount+1)}–${pad(b.total)}${b.sec?` · กั้นทุก ${b.sec}${b.refill?' · เติมซองจากขวาสุด':''}`:''}${b.closed?' · ปิดแล้ว':''}</div></div></header>
  <div class="stats">
    <div class="stat"><b>${R.U}</b><span>ซองที่เหลือ</span></div>
    <div class="stat"><b>${R.H}<small class="muted" style="font-size:13px">/${b.hitCount}</small></b><span>ฮิตที่เหลือ</span></div>
    <div class="stat"><b>${R.U?pct(R.base):'–'}</b><span>ฮิตเรทตอนนี้</span></div>
    <div class="stat"><b>${R.spread?pct(R.mx):R.U?pct(R.base):'–'}</b><span>ซองที่ดีที่สุด</span></div>
  </div>
  <div class="play"><div>
    <div class="boxes">${boxHTML}</div>
    <div class="refill-bar">
      <span class="small">เติมซองจากขวาสุด</span>
      <div class="seg"><button aria-pressed="${!b.refill}" onclick="setRefill(false)">ปิด</button><button aria-pressed="${!!b.refill}" onclick="setRefill(true)">เปิด</button></div>
      ${b.refill?`<span class="small muted">กั้นทุก</span><input type="number" id="secIn" inputmode="numeric" min="1" max="100" value="${b.sec}" onchange="setSec(this.value)">
      <div class="seg"><button aria-pressed="${b.refillAt!=='end'}" onclick="setRA('gap')">ตรงที่หยิบ</button><button aria-pressed="${b.refillAt==='end'}" onclick="setRA('end')">ท้ายช่อง</button></div>`:''}
    </div>
    <div class="legend"><span><em style="background:linear-gradient(90deg,#4A0D16,#B02A40)"></em>ซองที่เหลือ</span><span><em style="background:rgba(255,255,255,.12)"></em>เปิดแล้ว (เกลือ)</span><span><em style="background:#E8CF8E"></em>ฮิตที่ออก</span><span><em style="background:rgb(255,138,61)"></em>แท่งส้ม = โอกาสฮิต</span></div>
    ${R.U&&!b.closed?`<div class="pos-pick" style="margin-top:14px">
      ${BX.length>1?`<div class="seg">${BX.map(bx=>`<button aria-pressed="${UI.box===bx.i}" onclick="UI.box=${bx.i};renderBoard('pos')">กล่อง ${bx.i+1}</button>`).join('')}</div>`:''}
      <span class="small">ซองที่</span>
      <input type="number" id="posN" min="1" inputmode="numeric" placeholder="11" enterkeyhint="go">

      <div class="seg"><button aria-pressed="${UI.side!=='R'}" onclick="setSide('L')">ซ้าย</button><button aria-pressed="${UI.side==='R'}" onclick="setSide('R')">ขวา</button></div>
      <button class="btn gold sm" onclick="goPos()">เลือก</button>

    <div class="card" style="margin-top:14px">

      ${R.H===0?'<div class="muted small">ฮิตออกครบแล้ว</div>':
        !R.obsN?'<div class="muted small" style="margin-top:4px">ยังไม่มีข้อมูล — จดเลขซองที่คนอื่นเปิด (ทั้งเกลือและฮิต) สัก 5–10 ซอง แอปจะเริ่มหาโซน</div>':

        `<div class="sug">${R.top.map(chip).join('')}</div>`}

      <div class="seg" style="flex-wrap:wrap">${modes.map(([v,t])=>{const rec=levelOf(st).key===v&&v!=='auto';return `<button aria-pressed="${(b.mode||'auto')===v}" onclick="setMode('${v}')">${t}${v==='auto'&&levelOf(st).key!=='none'?` <small style="opacity:.75">(${levelOf(st).name})</small>`:''}${rec?' <span class="recdot" title="แอปแนะนำ">★</span>':''}</button>`}).join('')}</div>
      <div class="note">ใช้: ${R.P.src}</div>
    </div>
    <div class="row" style="margin-top:12px">

  </div>

  app.querySelectorAll('.slices').forEach(s=>s.onclick=e=>{const t=e.target.closest('[data-p]');if(t)selPos(+t.dataset.p)});

  if(inp)inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();goPos()}};
  if(ni)ni.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveNum(UI.sel)}};
  if(UI.sel&&ni){ni.focus();ni.select();$('#rec').scrollIntoView({block:'nearest',behavior:'smooth'})}
  else if(focus==='pos'&&inp)inp.focus({preventScroll:true});
}
function setSide(s){UI.side=s;const v=$('#posN')?.value;renderBoard('pos');if(v&&$('#posN'))$('#posN').value=v}
function selPos(x){const b=getB(S.cur);UI.sel=x;const bx=boxOf(b,x);if(bx)UI.box=bx.i;renderBoard()}
function goPos(){
  const b=getB(S.cur),n=parseInt($('#posN').value);
  const bx=boxes(b)[UI.box],r=remainIn(b,bx);
  if(!n||n<1||n>r.length){toast(`ใส่เลข 1–${r.length} (เหลือ ${r.length} ซองใน${boxes(b).length>1?'กล่องนี้':'กล่อง'})`);return}
  UI.sel=UI.side==='R'?r[r.length-n]:r[n-1];renderBoard();
}
function saveNum(x){
  const b=getB(S.cur),v=parseInt($('#numIn').value);
  if(!v||v<1||v>b.total){toast(`ใส่เลข 1–${b.total}`);return}
  const at=usedNums(b).get(v);
  if(at&&at!==x){toast(`เลข ${pad(v)} บันทึกไว้แล้วที่ซองตำแหน่งเดิม #${at}\nถ้าจดผิด แตะรายการนั้นในช่อง “ออกแล้ว” เพื่อแก้`);return}
  mark(x,v);
}
function openSettings(){
  const b=getB(S.cur);
  openSheet(`<h2>ตั้งค่ากล่อง</h2>
  <label class="f">กระดาษกั้นทุกกี่ซอง (0 = ไม่มี)</label><input class="in" id="sSec" type="number" inputmode="numeric" min="0" max="100" value="${b.sec||0}">
  <label class="row small" style="margin-top:10px;gap:10px;cursor:pointer"><input type="checkbox" id="sRefill" ${b.refill?'checked':''} style="width:22px;height:22px;accent-color:#C9A45C"> หยิบแล้วร้านเอาซองขวาสุดมาเติมให้ช่องเต็ม</label>
  <div class="seg" style="margin-top:8px"><button type="button" aria-pressed="${b.refillAt!=='end'}" data-ra="gap" onclick="pickRA(this)">เติมตรงที่หยิบ</button><button type="button" aria-pressed="${b.refillAt==='end'}" data-ra="end" onclick="pickRA(this)">เติมท้ายช่องนั้น</button></div>
  <p class="note">เปลี่ยนแล้วแอปจะคำนวณลำดับซองใหม่จากที่จดไว้ทั้งหมดให้อัตโนมัติ</p>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="closeSheet()">ยกเลิก</button><button class="btn gold" style="flex:1" onclick="saveSettings()">บันทึก</button></div>`);
}
function saveSettings(){
  const b=getB(S.cur);b.sec=clamp(parseInt($('#sSec').value)||0,0,100);b.refill=$('#sRefill').checked&&b.sec>0;
  b.refillAt=document.querySelector('#sheet [data-ra][aria-pressed="true"]')?.dataset.ra||'gap';
  UI.sel=null;save();closeSheet();renderBoard('pos');
}
function setRefill(on){const b=getB(S.cur);b.refill=on;if(on&&!(b.sec>0))b.sec=20;UI.sel=null;save();renderBoard('pos')}
function setSec(v){const b=getB(S.cur);b.sec=clamp(parseInt(v)||20,1,100);UI.sel=null;save();renderBoard('pos')}
function setRA(v){const b=getB(S.cur);b.refillAt=v;UI.sel=null;save();renderBoard('pos')}
function setMode(v){const b=getB(S.cur);b.mode=v;save();renderBoard()}
function pushLog(b,x){b.log.push({x,prev:b.opened[x]?{...b.opened[x]}:null,seq:seqOf(b).slice()});if(b.log.length>300)b.log.shift()}
function mark(x,v){
  const b=getB(S.cur),seq=seqOf(b);pushLog(b,x);
  b.opened[x]={v};if(!seq.includes(x))seq.push(x);
  UI.sel=null;save();renderBoard('pos');
}
function unmark(x){
  const b=getB(S.cur),seq=seqOf(b);pushLog(b,x);
  delete b.opened[x];const i=seq.indexOf(x);if(i>=0)seq.splice(i,1);
  UI.sel=null;save();renderBoard('pos');
}
function undo(){
  const b=getB(S.cur),l=b.log.pop();if(!l)return;
  if(l.prev)b.opened[l.x]=l.prev;else delete b.opened[l.x];
  if(l.seq)b.seq=l.seq;
  UI.sel=null;save();renderBoard('pos');
}
function closeBoard(){
  const b=getB(S.cur),f=foundHits(b).length;
  const msg=f<b.hitCount?`ยังจดฮิตไม่ครบ (${f}/${b.hitCount})\nข้อมูลที่จดไว้ยังใช้วิเคราะห์ร้านได้\n\nปิดกระดานเลยไหม?`:'ปิดกระดานและบันทึกเป็นข้อมูลร้าน?';
  ask(msg.replace(/\n/g,'<br>'),'ปิดกระดาน',()=>{b.closed=true;UI.sel=null;save();renderBoard()});
}
function reopen(){const b=getB(S.cur);b.closed=false;save();renderBoard()}
function delBoard(){ask('ลบกระดานนี้ถาวร?','ลบกระดาน',()=>{const sh=getB(S.cur).shop;S.boards=S.boards.filter(b=>b.id!==S.cur);save();openShop(sh)})}

/* ===== sheet / backup ===== */
function openSheet(h){$('#sheet').innerHTML=h;$('#ov').classList.add('on')}
function closeSheet(){$('#ov').classList.remove('on')}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.innerHTML=esc(m).replace(/\n/g,'<br>');t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3200)}
let _ask=null;
function ask(msg,yes,fn){_ask=fn;openSheet(`<h2>ยืนยัน</h2><p style="line-height:1.6">${msg}</p>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="closeSheet()">ยกเลิก</button><button class="btn red" style="flex:1" onclick="closeSheet();_ask&&_ask()">${yes}</button></div>`)}
function exportData(){
  const txt=JSON.stringify(S);
  try{const blob=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='j-hunter-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}
  openSheet(`<h2>สำรองข้อมูล</h2><p class="note">ถ้าไฟล์ไม่ดาวน์โหลดเอง ให้กดคัดลอกข้อความด้านล่าง แล้วไปวางในเครื่องอื่นที่ปุ่ม “วางข้อมูล”</p>
  <textarea class="in" id="expTxt" rows="6" readonly style="font-family:var(--num);font-size:12px">${esc(txt)}</textarea>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="closeSheet()">ปิด</button><button class="btn gold" style="flex:1" onclick="copyExp()">คัดลอกข้อมูล</button></div>`);
}
function copyExp(){const t=$('#expTxt');navigator.clipboard?.writeText(t.value).then(()=>toast('คัดลอกแล้ว'),()=>{t.select();toast('กด Ctrl+C / คัดลอก ได้เลย')})||(t.select(),toast('กด Ctrl+C / คัดลอก ได้เลย'))}
function pasteData(){openSheet(`<h2>วางข้อมูล</h2><p class="note">วางข้อความที่คัดลอกมาจากอีกเครื่อง กระดานที่ยังไม่มีจะถูกเพิ่มเข้ามา</p>
  <textarea class="in" id="impTxt" rows="6" style="font-family:var(--num);font-size:12px"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="closeSheet()">ยกเลิก</button><button class="btn gold" style="flex:1" onclick="mergeData($('#impTxt').value)">นำเข้า</button></div>`)}
function mergeData(txt){try{
    const d=JSON.parse(txt);if(!Array.isArray(d.boards))throw 0;
    const ids=new Set(S.boards.map(b=>b.id));let add=0;
    d.boards.forEach(b=>{if(!ids.has(b.id)){S.boards.push(b);add++}});
    (d.shops||[]).forEach(n=>{if(!shopList().includes(n))S.shops.push(n)});
    save();closeSheet();toast('นำเข้าแล้ว '+add+' กระดาน');renderHome();
  }catch(e){toast('ข้อมูลไม่ถูกต้อง')}}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>mergeData(r.result);
  r.readAsText(f);
}

/* ===== ซิงก์ข้ามเครื่องผ่าน Supabase (ไม่ต้องล็อกอิน ใช้รหัสซิงก์) ===== */
const SB_URL='https://adtrhfenqcbjdzwurdee.supabase.co', SB_KEY='sb_publishable_69WNqfu2SegYkUjipstgvw___XOOSkr';
const SB_OK=/^https:\/\//.test(SB_URL)&&SB_KEY.length>20;
const CODE_KEY='jhunter.sync';
let SPACE=null,CODE=null,synced={},metaSynced=null,lastRev=0,syncState='local',pendingRender=false,_t=null,_chain=Promise.resolve(),_poll=null,_pulling=false;
if(!Array.isArray(S.deleted))S.deleted=[];
const sig=b=>{const {log,ts,...r}=b;return JSON.stringify(r)};
const bodyOf=b=>{const {log,...r}=b;return JSON.parse(JSON.stringify(r))};
const metaOf=()=>({shops:shopList().slice(),deleted:S.deleted.slice(-300)});
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jhunter:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function rpc(fn,body){
  const r=await fetch(SB_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:SB_KEY},/^eyJ/.test(SB_KEY)?{Authorization:'Bearer '+SB_KEY}:{}),body:JSON.stringify(body)});
  if(!r.ok)throw new Error(fn+' '+r.status);return r.json();
}
function setSync(st){syncState=st;paintSync()}
function paintSync(){const el=$('#syncPill');if(!el)return;
  const m={local:[SB_OK?'ซิงก์: ยังไม่ได้ตั้งรหัส':'เก็บในเครื่องนี้','off'],saving:['กำลังซิงก์…','busy'],ok:['ซิงก์แล้ว','ok'],err:['ออฟไลน์ · เก็บในเครื่องไว้ก่อน','off']}[syncState];
  el.textContent=m[0];el.className='sync '+m[1];el.onclick=SB_OK?openSync:null;el.style.cursor=SB_OK?'pointer':''}
function route(){S.cur&&getB(S.cur)?renderBoard():S.shopView?renderShop():renderHome()}
function rerender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.value){pendingRender=true;return}
  if($('#ov')?.classList.contains('on')){pendingRender=true;return}pendingRender=false;route()}
function scheduleSync(){if(!SPACE)return;clearTimeout(_t);_t=setTimeout(()=>{_chain=_chain.then(doPush).catch(()=>setSync('err'))},500)}
async function doPush(){
  let did=false;const mark=()=>{if(!did){setSync('saving');did=true}};
  for(const b of S.boards.slice()){const g=sig(b);if(synced[b.id]===g)continue;mark();
    b.ts=Date.now();await rpc('jh_push',{p_space:SPACE,p_id:b.id,p_data:bodyOf(b),p_ts:b.ts});synced[b.id]=g}
  for(const id of Object.keys(synced)){if(getB(id))continue;mark();
    if(!S.deleted.includes(id))S.deleted.push(id);
    await rpc('jh_push',{p_space:SPACE,p_id:id,p_data:{deleted:true},p_ts:Date.now()});delete synced[id]}
  const m=JSON.stringify(metaOf());
  if(m!==metaSynced){mark();await rpc('jh_push',{p_space:SPACE,p_id:'_meta',p_data:JSON.parse(m),p_ts:Date.now()});metaSynced=m}
  if(did)persist();
  setSync('ok');
}
function applyRows(rows,first){
  let changed=false;
  rows.forEach(r=>{
    lastRev=Math.max(lastRev,+r.rev||0);
    const d=r.data||{};
    if(r.id==='_meta'){
      const pending=metaSynced!==null&&JSON.stringify(metaOf())!==metaSynced;
      const del=new Set([...S.deleted,...(d.deleted||[])]);S.deleted=[...del];
      const nb=S.boards.filter(b=>!del.has(b.id));if(nb.length!==S.boards.length){S.boards=nb;changed=true}
      if(first){const sh=shopList();(d.shops||[]).forEach(n=>{if(!sh.includes(n))sh.push(n)});changed=true}
      else if(!pending){S.shops=(d.shops||[]).slice();shopList();metaSynced=JSON.stringify(metaOf());changed=true}
      return;
    }
    const id=r.id,loc=getB(id);
    if(d.deleted){if(!S.deleted.includes(id))S.deleted.push(id);if(loc){S.boards=S.boards.filter(b=>b!==loc);changed=true}delete synced[id];return}
    if(S.deleted.includes(id))return;
    const g=sig(d);
    if(loc&&sig(loc)===g){synced[id]=g;return}
    if(loc&&synced[id]!==sig(loc)&&(loc.ts||0)>(+r.ts||0))return; // เครื่องนี้แก้ใหม่กว่าและยังไม่ได้ส่ง
    const nb=JSON.parse(JSON.stringify(d));nb.log=loc?.log||[];nb.ts=+r.ts||0;
    if(loc)S.boards[S.boards.indexOf(loc)]=nb;else S.boards.push(nb);
    synced[id]=g;changed=true;
  });
  return changed;
}
async function pull(first){
  if(!SPACE||_pulling)return;_pulling=true;
  try{const rows=await rpc('jh_pull',{p_space:SPACE,p_since:first?0:lastRev});
    const c=applyRows(rows,first);
    if(first){persist();scheduleSync();route()}
    else if(c){persist();rerender()}
    if(syncState!=='saving')setSync('ok');
  }catch(e){setSync('err')}finally{_pulling=false}
}
async function startSync(code){
  if(!SB_OK||!code)return;
  CODE=code;SPACE=await sha(code);synced={};metaSynced=null;lastRev=0;
  setSync('saving');await pull(true);
  clearInterval(_poll);_poll=setInterval(()=>{if(!document.hidden)pull(false)},4000);
}
function newCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(16));return [...r].map(x=>a[x%a.length]).join('').replace(/(.{4})(?=.)/g,'$1-')}
function syncLink(){return location.origin+location.pathname+'#sync='+encodeURIComponent(CODE)}
function openSync(){
  if(!CODE){openSheet(`<h2>ซิงก์ข้ามเครื่อง</h2>
    <p class="note">เครื่องแรก: กด “สร้างรหัสใหม่” · เครื่องอื่น: ใส่รหัสเดียวกัน หรือเปิดลิงก์ซิงก์ที่ได้จากเครื่องแรก</p>
    <button class="btn gold block" style="margin-top:10px" onclick="setCode(newCode())">สร้างรหัสใหม่</button>
    <label class="f">หรือใส่รหัสที่มีอยู่แล้ว</label><input class="in" id="codeIn" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" style="font-family:var(--num)">
    <div class="row" style="margin-top:12px"><button class="btn" onclick="closeSheet()">ปิด</button><button class="btn gold" style="flex:1" onclick="setCode($('#codeIn').value)">ใช้รหัสนี้</button></div>`);return}
  openSheet(`<h2>ซิงก์ข้ามเครื่อง</h2>
    <p class="note">เปิดลิงก์นี้ในเครื่องอื่นครั้งเดียว เครื่องนั้นจะซิงก์ตามเลย เก็บรหัสนี้เป็นความลับ ใครมีรหัสจะเห็นข้อมูลนี้</p>
    <label class="f">รหัสซิงก์</label><input class="in" id="codeShow" readonly value="${esc(CODE)}" style="font-family:var(--num);font-weight:700;letter-spacing:1px">
    <label class="f">ลิงก์ซิงก์</label><input class="in" id="linkShow" readonly value="${esc(syncLink())}" style="font-size:13px">
    <div class="row" style="margin-top:12px"><button class="btn gold" style="flex:1" onclick="copyText('linkShow')">คัดลอกลิงก์</button><button class="btn" onclick="copyText('codeShow')">คัดลอกรหัส</button></div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="closeSheet()">ปิด</button><button class="btn red sm" onclick="ask('เลิกซิงก์เครื่องนี้? ข้อมูลในเครื่องยังอยู่ และข้อมูลออนไลน์ไม่ถูกลบ','เลิกซิงก์',()=>{lsSet(CODE_KEY,null);location.reload()})">เลิกซิงก์เครื่องนี้</button></div>`);
}
function copyText(id){const t=$('#'+id);const done=()=>toast('คัดลอกแล้ว');try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();document.execCommand('copy');done()})}catch(e){t.select();document.execCommand('copy');done()}}
async function setCode(c){c=String(c||'').trim().toUpperCase().replace(/\s+/g,'');if(c.replace(/-/g,'').length<12){toast('รหัสสั้นเกินไป');return}
  lsSet(CODE_KEY,c);closeSheet();await startSync(c);openSync()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(SPACE)pull(false);if(pendingRender)rerender()}});
(function bootSync(){
  const m=location.hash.match(/sync=([^&]+)/);
  if(m){lsSet(CODE_KEY,decodeURIComponent(m[1]).toUpperCase());history.replaceState(null,'',location.pathname+location.search)}
  const c=lsGet(CODE_KEY);if(c&&SB_OK)startSync(c);
})();
S.cur&&getB(S.cur)?renderBoard('pos'):S.shopView?renderShop():renderHome();
paintSync();

</script>
