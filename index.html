<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J Hunter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0F13">
<title>J Hunter</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F13;--panel:#1A1C23;--panel2:#22252E;--ink:#F3EDE2;--muted:#8A8F9C;--line:rgba(201,164,92,.16);--red:#B3263A;--gold:#C9A45C;--gold2:#E8CF8E;--hot:255,138,61;--glass-edge:rgba(201,164,92,.28);
--display:"Noto Serif Thai","IBM Plex Sans Thai",Georgia,serif;--num:"Inter","IBM Plex Sans Thai",system-ui,sans-serif;--body:"IBM Plex Sans Thai",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:1000px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 48px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;background:linear-gradient(#F4E2B0,#C9A45C);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:3px;color:var(--gold);-webkit-text-fill-color:var(--gold)}
.sub{color:var(--muted);font-size:12px}
h3{font-family:var(--display);font-size:15px;color:var(--gold2);margin:24px 0 10px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}
.num{font-family:var(--num)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);font-size:14px;padding:10px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;min-height:42px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.gold{background:var(--gold);color:#14151A;border:0}
.btn.red{border-color:rgba(179,38,58,.5);color:#E8798A}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;min-height:34px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.click{cursor:pointer;width:100%;text-align:left}
.card .t{font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);margin-left:6px;white-space:nowrap}
.progress{height:4px;border-radius:9px;background:var(--panel2);overflow:hidden;margin:8px 0 6px}
.progress i{display:block;height:100%;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--num);font-size:22px;color:var(--gold2)}
.stat span{font-size:11px;color:var(--muted)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ===== กล่องซองแบบ LastOne ===== */
.boxes{display:flex;flex-direction:column;align-items:center;gap:18px;margin:6px 0 14px}
.bwrap{width:100%;max-width:640px}
.heat{display:flex;align-items:flex-end;height:38px;margin:0 5%;gap:0}
.hb{flex:1 1 0;min-width:0;height:var(--v);margin:0 .5px;border-radius:2px 2px 0 0;background:linear-gradient(rgb(var(--hot)),rgba(var(--hot),.25));opacity:calc(.25 + var(--v-n)*.75)}
.hb.z{background:transparent}
.hb.hit{height:9px;width:9px;flex:0 0 auto;margin:0 -4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4D6,#E8CF8E 40%,#9C7A36);opacity:1;z-index:2;align-self:flex-end;position:relative;top:-2px}
.box{position:relative;width:100%;aspect-ratio:2.5/1}
.box .tray{pointer-events:none;position:absolute;inset:10% 3% 0;border-radius:8px;background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.03));border:1.5px solid var(--glass-edge);box-shadow:0 18px 26px -18px rgba(0,0,0,.8)}
.box .slices{position:absolute;left:5%;right:5%;bottom:7%;height:80%;display:flex;align-items:flex-end}
.box .front{pointer-events:none;position:absolute;inset:46% 3% 0;border-radius:0 0 8px 8px;background:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,.09));border:1px solid var(--glass-edge);border-top:1px solid rgba(255,255,255,.35);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px)}
.box .tag{pointer-events:none;position:absolute;left:50%;top:64%;transform:translateX(-50%);background:#121318;color:var(--gold2);border:1px solid var(--gold);border-radius:4px;padding:3px 12px;font-family:var(--num);font-weight:700;font-size:clamp(.8rem,2.6vw,1.05rem);white-space:nowrap}
.box .box-no{position:absolute;left:10px;top:4px;font-size:11px;color:var(--muted);font-family:var(--num)}
.sl{flex:1 1 0;min-width:0;height:100%;position:relative;cursor:pointer;border-radius:2px 2px 0 0;background:linear-gradient(90deg,#4A0D16,#B02A40 45%,#5C1220);border-left:1px solid rgba(255,200,200,.14);transition:height .2s cubic-bezier(.3,1.5,.5,1),filter .2s}
.sl::before{content:"";position:absolute;left:0;right:0;top:0;height:5%;min-height:3px;border-radius:2px 2px 0 0;background:linear-gradient(#E8798A,#7A1626)}
@media(hover:hover){.sl:hover{height:118%;filter:brightness(1.5);z-index:2}}
.sl.hot{box-shadow:0 0 calc(var(--h)*10px) rgba(var(--hot),calc(var(--h)*.9))}
.sl.sel{height:120%;z-index:3;background:linear-gradient(90deg,#7A5C22,#F4E2B0 45%,#9C7A36);box-shadow:0 0 12px rgba(232,207,142,.6)}
.sl.sel::before{background:linear-gradient(#FFF4D6,#D9A93A)}
.dv{flex:0 0 3px;align-self:stretch;margin:0 1px;height:112%;position:relative;top:-6%;border-radius:2px;background:linear-gradient(#F4E2B0,#9C7A36);opacity:.85;pointer-events:none}
.hdv{flex:0 0 5px}
.slg{flex:1 1 0;min-width:0;height:12%;margin:0 .5px;border-radius:2px 2px 0 0;background:rgba(255,255,255,.07);cursor:pointer}
.slg.hit{height:26%;background:linear-gradient(#E8CF8E,#7A5C22)}
.slg.sel{outline:2px solid var(--gold2)}

/* ตัวเลือกตำแหน่ง */
.pos-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;max-width:780px;margin:0 auto}
.pos-pick input{width:84px;text-align:center;font-family:var(--num);font-weight:700;font-size:20px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button,.btn{-webkit-user-select:none;user-select:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-weight:600;color:var(--muted);min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#14151A}
.rec{max-width:780px;margin:12px auto 0;background:linear-gradient(160deg,rgba(201,164,92,.12),rgba(201,164,92,.03));border:1px solid var(--gold);border-radius:14px;padding:14px}
.rec .where{font-family:var(--display);font-size:18px;color:var(--gold2)}
.rec .orig{font-size:12px;color:var(--muted)}
.hitbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}
.hitbtns .btn{flex-direction:column;gap:0;border-color:rgba(201,164,92,.45);color:var(--gold2);padding:6px}
.hitbtns .btn small{font-size:10px;color:var(--muted);font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitbtns .btn.cur{background:rgba(201,164,92,.25)}

.play{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px;align-items:start}
@media(max-width:900px){.play{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:620px;overflow:auto}
.side h4{margin:0 0 8px;font-family:var(--display);color:var(--gold2);font-weight:600}
.side ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
@media(max-width:900px){.side{max-height:none}.side ol{flex-direction:row;flex-wrap:wrap}}
.side li{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 8px;border-radius:8px;background:var(--panel2);cursor:pointer;font-family:var(--num)}
.side li.hit{background:rgba(201,164,92,.18);color:var(--gold2)}
.side li i{font-style:normal;color:var(--muted);font-size:11px}

.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--panel2);border:1px solid rgba(var(--hot),.6);color:#FFB48C;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:var(--num)}
.list div{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.list div:last-child{border:0}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.in{font-size:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .seg{flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:10;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h2{margin:0 0 4px;font-family:var(--display);color:var(--gold2);font-size:20px}
.segT{display:flex;gap:6px}.segT button{flex:1}
.segT .btn.on{border-color:var(--gold);color:var(--gold2)}
.refill-bar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:-4px auto 10px}
.refill-bar .seg button{min-height:32px;padding:4px 12px}
.refill-bar input{width:60px;text-align:center;font-family:var(--num);font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px}
.bc-odds{display:flex;gap:14px;text-align:right}
.bc-odds div{display:flex;flex-direction:column}
.bc-odds b{font-family:var(--num);font-size:18px;color:var(--ink)}
.bc-odds .hi b{font-size:22px;color:var(--gold2)}
.bc-odds span{font-size:11px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
:root{color-scheme:dark}
.sync{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync:empty{display:none}
.sync.ok{border-color:rgba(46,139,110,.6);color:#7FD3B4}
.sync.busy{border-color:var(--gold);color:var(--gold2)}
.lvl{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.lvl-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl-top .pill{margin:0}
.lvl-name{font-family:var(--display);font-size:20px;color:var(--gold2);margin:4px 0 8px}
.lv-off .lvl-name,.lv-none .lvl-name{color:var(--ink)}
.lv-high{border-color:rgba(var(--hot),.6)}
.meter{position:relative;height:8px;border-radius:9px;background:linear-gradient(90deg,#3a3d47 0 20%,#6b5a33 20% 42%,#a9802f 42% 68%,rgb(var(--hot)) 68%)}
.meter .dot{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--gold)}
.meter-lbl{display:grid;grid-template-columns:20% 22% 26% 32%;font-size:11px;color:var(--muted);margin-top:4px}
.meter-lbl span{text-align:center}
.lvl-adv{margin-top:8px;line-height:1.55}
.recdot{color:var(--gold2)}
.why{margin-top:4px}
.why summary{cursor:pointer;font-size:12px;color:var(--gold);list-style:none;display:inline-block}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"▸ ";}
.why[open] summary::before{content:"▾ ";}
.why ul{margin:6px 0 2px;padding-left:18px;font-size:13px;line-height:1.6;color:var(--ink)}
.why li{margin-bottom:3px}
.bc-acts{justify-content:flex-end;margin-top:10px}
.bcard:focus-visible{outline:2px solid var(--gold)}
.picks{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pick{background:var(--panel2);border:1px solid rgba(var(--hot),.45);border-radius:12px;padding:10px 12px;cursor:pointer}
.pick:focus-visible{outline:2px solid var(--gold)}
.pk-top{display:flex;align-items:center;gap:10px}
.pk-rank{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--hot),.18);color:#FFB48C;font-family:var(--num);font-weight:700;font-size:13px;flex:0 0 auto}
.pk-pos{flex:1;min-width:0}
.pk-p{font-family:var(--num);font-weight:700;font-size:22px;color:#FFB48C}
.pk-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:13px}
.pk-n{font-family:var(--num);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.pk-n.hit{border-color:var(--gold);color:var(--gold2)}
.pk-n small{color:var(--muted)}
.calc{margin-top:8px;font-size:12px;color:var(--gold2)}
.meter .ci{position:absolute;top:-3px;height:14px;border-radius:7px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:4px}
.legend em{display:inline-block;width:8px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:5px}

/* ===== ผลทาย (สีเขียว) / ตามล่าเลข / ความคุ้ม ===== */
:root{--ok:#3DDC84;--ok2:#9BE7B8}
.slg.g-ex{background:var(--ok);height:18%}
.slg.g-nr{background:rgba(155,231,184,.55)}
.slg.hit.g-ct{box-shadow:inset 0 0 0 2px var(--ok)}
.slg.hit.g-ex{background:linear-gradient(var(--ok),#1E7A47);height:26%}
.side li.g-ex{background:rgba(61,220,132,.22);color:#C9F5DA}
.side li.g-nr{background:rgba(155,231,184,.10);box-shadow:inset 3px 0 0 var(--ok2)}
.side li.g-ct{box-shadow:inset 3px 0 0 var(--ok)}
.side li .gb{margin-left:auto;font-size:10px;font-family:var(--body);font-weight:700;padding:1px 6px;border-radius:99px;background:rgba(61,220,132,.2);color:var(--ok);white-space:nowrap}
.side li .gb.nr{background:rgba(155,231,184,.12);color:var(--ok2)}
.side li .gb.ct{background:rgba(201,164,92,.22);color:var(--gold2)}
.side li{flex-wrap:wrap}.side li .lb{color:var(--ink);font-family:var(--body);white-space:nowrap}
.side li.arch{cursor:default;opacity:.8}
.side .rnd{font-size:11px;color:var(--gold);margin:10px 0 4px;letter-spacing:.5px;flex-basis:100%}
.score{background:linear-gradient(160deg,rgba(61,220,132,.10),rgba(61,220,132,.02));border:1px solid rgba(61,220,132,.35);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.score .sc-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--ok2);font-weight:600;margin-bottom:6px}
.score .sc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.score .sc{background:rgba(0,0,0,.18);border-radius:10px;padding:8px;text-align:center}
.score .sc b{display:block;font-family:var(--num);font-size:20px;color:var(--ok)}
.score .sc span{display:block;font-size:11px;color:var(--muted)}
.score .sc i{display:block;font-style:normal;font-size:11px;color:var(--ok2)}
.hunt{margin-top:12px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid rgba(61,220,132,.3)}
.hunt .row input{flex:1;min-width:120px;font-family:var(--num);font-weight:700;font-size:16px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px}
.tg{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tg:last-child{border:0}
.tg .tp{font-family:var(--num);font-weight:700;color:var(--ok)}
.tgpk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tgpk button{background:var(--panel);border:1px solid rgba(61,220,132,.45);color:var(--ok2);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:var(--num)}
.rankseg{margin-top:10px}
.pick.tgt{border-color:rgba(61,220,132,.5)}
.pick.tgt .pk-p,.pick.tgt .pk-rank{color:var(--ok)}
.ev-pos{color:var(--ok)}.ev-neg{color:#FF8A8A}
.evbar{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.18)}
.stats.s5{grid-template-columns:repeat(5,1fr)}
@media(max-width:620px){.stats.s5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.score .sc-row{grid-template-columns:repeat(3,1fr)}.score .sc b{font-size:17px}}
.style{margin-top:14px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.st-name{font-family:var(--display);font-size:19px;color:var(--gold2);margin:4px 0 2px}
.st-name .num{font-size:15px;color:var(--muted);font-family:var(--num)}
.stbars{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.stb{display:grid;grid-template-columns:minmax(0,190px) 1fr 40px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.stb i{display:block;height:8px;border-radius:4px;background:rgba(201,164,92,.35);min-width:2px}
.stb.on{color:var(--ink)}.stb.on i{background:var(--gold)}
.stb b{font-family:var(--num);text-align:right;font-weight:600}
@media(max-width:520px){.stb{grid-template-columns:120px 1fr 36px}}
.sc2{background:rgba(0,0,0,.18);border-radius:10px;padding:9px 12px;margin-top:6px}
.sc2-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sc2-ic{width:20px;text-align:center}
.sc2-h{flex:1;min-width:150px;color:var(--ink);font-weight:600;font-size:14px}
.sc2-n{font-family:var(--num);font-size:20px;color:var(--ok)}
.sc2-n small{font-size:12px;color:var(--muted);font-weight:400}
.sc2-sub{font-size:13px;margin:2px 0 0 28px}
.sc2-ex{font-size:11px;color:var(--muted);margin:2px 0 0 28px}
.v-good{color:var(--ok);font-weight:700}.v-same{color:var(--muted);font-weight:700}.v-bad{color:#FF8A8A;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='jhunter.v1', PER=100;
let S=load();
const UI={sel:null,side:'L',box:0};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.boards))return s}catch(e){}return{boards:[],cur:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof scheduleSync==='function')scheduleSync()}
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(3,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>(v*100).toFixed(v<0.1?1:0)+'%';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const getB=id=>S.boards.find(b=>b.id===id);
/* ===== เลขฮิต: เรียง 001..N หรือระบุเอง (เช่น 065, 095, 101) ===== */
function hitList(b){return Array.isArray(b.hitNums)&&b.hitNums.length?b.hitNums.slice().sort((a,c)=>a-c):Array.from({length:b.hitCount||0},(_,i)=>i+1)}
const hitLabel=(b,n)=>{const i=hitList(b).indexOf(n);return i>=0&&b.labels&&b.labels[i]?b.labels[i]:''};
const hitName=(b,n)=>pad(n)+(hitLabel(b,n)?' '+hitLabel(b,n):'');
function hitRangeText(b){const h=hitList(b);if(!(b.hitNums&&b.hitNums.length))return `001–${pad(h.length)}`;return h.length>8?h.slice(0,6).map(pad).join(', ')+` … (${h.length} ใบ)`:h.map(pad).join(', ')}
function parseNums(t,max){return [...new Set(String(t||'').split(/[^0-9]+/).filter(Boolean).map(Number).filter(n=>n>=1&&n<=max))].sort((a,c)=>a-c)}
function seqOf(b){
  if(!Array.isArray(b.seq))b.seq=[];
  // เก็บกวาดข้อมูลจากเวอร์ชันเก่า: ตัดรายการที่ไม่มีซองจริง และเติมซองที่เปิดแล้วแต่ตกหล่น
  const ok=b.seq.filter((x,i,a)=>b.opened[x]&&a.indexOf(x)===i);
  Object.keys(b.opened).map(Number).forEach(x=>{if(!ok.includes(x))ok.push(x)});
  if(ok.length!==b.seq.length||ok.some((x,i)=>x!==b.seq[i]))b.seq=ok;
  return b.seq;
}

/* ===== ค่าของซอง: เลขที่ออก (ฮิต = 1..hitCount, เกลือ = hitCount+1..total) ===== */
function val(o){if(!o)return null;if(o.v!==undefined)return o.v;if(o.type==='hit')return o.hit;return null}
const isHitV=(b,v)=>v!=null&&hitList(b).includes(v);
function obsOf(b){return Object.entries(b.opened).map(([k,o])=>({pos:+k,v:val(o)})).filter(o=>o.v!=null)}
function foundHits(b){return obsOf(b).filter(o=>isHitV(b,o.v)).map(o=>({n:o.v,pos:o.pos}))}
/* รอบก่อนร้านสับใหม่: เลขที่ออกไปแล้วในรอบก่อนจะไม่อยู่ในกล่องอีก (ตำแหน่ง 0 = ออกในรอบก่อน) */
const NM=b=>b.numMax||b.total;
const archOf=b=>Array.isArray(b.archive)?b.archive:[];
function roundObs(opened){return Object.entries(opened||{}).map(([k,o])=>({pos:+k,v:val(o)})).filter(o=>o.v!=null)}
function archNums(b){const m=new Map();archOf(b).forEach((r,ri)=>roundObs(r.opened).forEach(o=>m.set(o.v,{round:ri+1,pos:o.pos})));return m}
function usedNums(b){const m=new Map();archNums(b).forEach((_,v)=>m.set(v,0));obsOf(b).forEach(o=>m.set(o.v,o.pos));return m}
function foundHitsAll(b){const a=[];archOf(b).forEach(r=>roundObs(r.opened).forEach(o=>{if(isHitV(b,o.v))a.push(o.v)}));return a.concat(foundHits(b).map(o=>o.n))}
function numLabel(b,v){return v==null?'เกลือ (ไม่รู้เลข)':isHitV(b,v)?'★ '+pad(v):pad(v)}

/* ===== กล่อง / นับตำแหน่ง ===== */
function boxes(b){
  let n=b.boxN>0?b.boxN:0,per=b.boxPer>0?b.boxPer:0;
  if(!n&&!per)n=Math.ceil(b.total/PER);
  if(n&&!per)per=Math.ceil(b.total/n);
  if(per&&!n)n=Math.ceil(b.total/per);
  if(n*per<b.total)per=Math.ceil(b.total/n);
  const out=[];for(let i=0;i<n;i++){const from=i*per+1,to=Math.min(b.total,(i+1)*per);if(from<=to)out.push({i:out.length,from,to})}
  return out;
}
function boxOf(b,x){return boxes(b).find(bx=>x>=bx.from&&x<=bx.to)}
/* ลำดับซองจริงในกล่องตอนนี้ (เก็บเป็นตำแหน่งเดิมของซอง)
   โหมดเติมซอง: หยิบซองออกแล้วร้านเอาซองขวาสุดของกล่องมาเติมให้ช่อง (กระดาษกั้น) เต็มเหมือนเดิม
   คำนวณใหม่จากลำดับที่จดทุกครั้ง จึงแก้/ย้อนกลับได้เสมอ */
let _po={k:null,v:null};
function physOrder(b){
  const seq=seqOf(b),k=[b.id,b.total,b.boxN||0,b.boxPer||0,b.refill?1:0,b.sec||0,b.refillAt||'gap',seq.join(','),Object.keys(b.opened).join(',')].join('|');
  if(_po.k===k)return _po.v;
  const mv=new Set();
  const BX=boxes(b),arr=BX.map(bx=>{const a=[];for(let x=bx.from;x<=bx.to;x++)a.push(x);return a});
  if(b.refill&&b.sec>0){
    const sec=b.sec;
    seq.forEach(x=>{
      if(!b.opened[x])return;
      const a=arr[BX.findIndex(bx=>x>=bx.from&&x<=bx.to)],i=a.indexOf(x);if(i<0)return;
      a.splice(i,1);
      if(!a.length)return;
      const si=Math.floor(i/sec),sl=Math.floor((a.length-1)/sec);
      if(si<sl){const m=a.pop();mv.add(m);a.splice(b.refillAt==='end'?Math.min(a.length,(si+1)*sec-1):i,0,m)}
    });
  }else arr.forEach((a,i)=>arr[i]=a.filter(x=>!b.opened[x]));
  _po={k,v:arr,mv};return arr;
}
function remainIn(b,bx){return physOrder(b)[bx.i]}
function moved(b,x){physOrder(b);return !!(b.refill&&_po.mv&&_po.mv.has(x))}
function lr(b,x){const bx=boxOf(b,x),r=remainIn(b,bx),k=r.indexOf(x);return{bx,k,L:k+1,R:r.length-k,n:r.length}}
function boxPrefix(b,bx){return boxes(b).length>1?`กล่อง ${bx.i+1} · `:''}

/* ===== วัดความสับ: เลขที่ติดกัน (เช่น 045 กับ 046) อยู่ห่างกันกี่ซอง ===== */
const P0=()=>({n:0,close:0,sk:0,fw:0,ks:[]});
const addP=(a,c)=>({n:a.n+c.n,close:a.close+c.close,sk:a.sk+c.sk,fw:a.fw+c.fw,ks:a.ks.concat(c.ks)});
/* นับทุกรอบของกระดาน (รอบก่อนร้านสับใหม่ด้วย) แยกกันต่อรอบ เพราะตำแหน่งคนละกล่อง */
function pairCount(b){return [roundObs(b.opened),...archOf(b).map(r=>roundObs(r.opened))].map(pairObs).reduce(addP,P0())}
function archPairs(b){return archOf(b).map(r=>pairObs(roundObs(r.opened))).reduce(addP,P0())}
function pairObs(list){
  // ดูทุกคู่ซองที่เลขห่างกันไม่เกิน 5 (เช่น 015 กับ 017): ถ้าตำแหน่งก็ใกล้กัน = ร้านสับไม่ทั่ว
  const o=list.slice().sort((a,c)=>a.v-c.v);let n=0,close=0,sk=0,fw=0;const ks=[];
  for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++){
    const dv=o[j].v-o[i].v;if(dv>5)break;const d=o[j].pos-o[i].pos,dp=Math.abs(d);n++;
    if(dp<=3*dv){close++;sk+=dv;if(d>0)fw++;ks.push(dp/dv)}
  }
  return{n,close,sk,fw,ks};
}
function shuffleStats(b,shop){
  const z={n:0,close:0,sk:0,fw:0,ks:[]};
  const cur=b?pairCount(b):z;
  const hist=S.boards.filter(x=>x.shop===(shop||b.shop)&&(b?x.closed&&x.id!==b.id:true)).map(pairCount);
  const t=[cur,...hist].reduce((a,c)=>({n:a.n+c.n,close:a.close+c.close,sk:a.sk+c.sk,fw:a.fw+c.fw,ks:a.ks.concat(c.ks)}),z);
  const ks=t.ks.sort((a,c)=>a-c);
  const step=ks.length>=3?clamp(ks[Math.floor(ks.length/2)],1,3):1;
  return{...t,boards:hist.length,q:(t.sk+1)/(t.sk+(t.n-t.close)+3),fp:(t.fw+1)/(t.close+2),step};
}
function shuffleText(st){
  if(!st.n)return'ยังไม่มีคู่เลขใกล้กัน (เช่น 015 กับ 017) ให้วัด';
  const r=st.q;
  const t=r>=0.6?'สับไม่ทั่วมาก 🔥':r>=0.35?'สับไม่ค่อยทั่ว':r>=0.15?'สับพอใช้':'ใกล้เคียงสุ่มจริง';
  return `คู่เลขใกล้กันที่อยู่ใกล้กันจริง ${st.close}/${st.n} คู่ · ดัชนีสับไม่ทั่ว ${Math.round(r*100)}% — ${t}${st.n<6?' · ข้อมูลยังน้อย':''}`;
}
function params(b){
  const st=shuffleStats(b),m=b.mode||'auto';
  const fixed={low:0.3,mid:0.55,high:0.8}[m];
  if(m==='off')return{q:0,fp:st.fp,step:st.step,st,src:'ปิดการคาดการณ์ (สุ่มล้วน)'};
  if(fixed)return{q:fixed,fp:st.fp,step:st.step,st,src:'ตั้งเอง: '+{low:'ต่ำ',mid:'กลาง',high:'สูง'}[m]};
  return{q:st.q,fp:st.fp,step:st.step,st,src:st.n?`อัตโนมัติจากข้อมูล ${st.n} คู่เลข${st.boards?` (รวม ${st.boards} กระดานเก่าของร้าน)`:''}`:'อัตโนมัติ: ยังไม่มีข้อมูล ใช้ค่าเริ่มต้น'};
}

/* ===== ประเมินระดับการสับจากข้อมูล ===== */
function levelOf(st){
  if(st.n<3||st.close+ (st.n-st.close)<3)return{key:'none',name:'ยังบอกไม่ได้',conf:'ข้อมูลยังน้อย'};
  const q=st.q;
  const conf=st.n>=12?'ค่อนข้างแน่น':st.n>=6?'พอเชื่อได้':'ข้อมูลยังน้อย';
  if(q<0.2)return{key:'off',name:'ใกล้เคียงสุ่ม',conf,q};
  if(q<0.42)return{key:'low',name:'ต่ำ',conf,q};
  if(q<0.68)return{key:'mid',name:'กลาง',conf,q};
  return{key:'high',name:'สูง',conf,q};
}
/* ===== วิธีสับที่น่าจะเป็น (จำแนกจาก posterior ของเครื่องคำนวณแบบเบย์ + หลักฐานจากคู่เลข) ===== */
const STYLE={
  none:{n:'แทบไม่สับ',ic:'📏',adv:'เลขยังเรียงยาวเกือบทั้งกล่อง — นับต่อจากเลขที่ออกได้เลย ซองข้าง ๆ เลขที่ใกล้ฮิตคือเป้าหมาย'},
  blocks:{n:'ตัดเป็นก้อนแล้วสลับก้อน',ic:'🧱',adv:'เลขเรียงเป็นก้อนสั้น ๆ — หาก้อนที่มีเลขใกล้ฮิต แล้วจุ่มซองถัดไปในก้อนนั้นตามทิศที่เลขเรียง ถ้าเลยความยาวก้อนไปแล้วมักข้ามไปก้อนอื่น'},
  riffle:{n:'แบ่งสองกองแล้วสลับเข้าหากัน',ic:'🔀',adv:'เลขต่อกันมักอยู่เว้นทีละซอง — ถ้าเห็นเลขใกล้ฮิต ให้ดูซองที่ห่างไป 2 ซอง ไม่ใช่ซองติดกัน'},
  random:{n:'สับทั่วจริง',ic:'🎲',adv:'ไม่พบแพทเทิร์นที่ใช้ได้ — ทุกซองโอกาสใกล้เคียงกัน อย่าทุ่มตามโซนที่แอปชี้'}
};
function revPairs(obs){
  // คู่เลขใกล้กัน (ห่าง ≤2) ที่อยู่ใกล้กันในกล่อง: เรียงไปข้างหน้า หรือถอยหลัง
  let fw=0,bw=0;const o=obs.slice().sort((a,c)=>a.v-c.v);
  for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++){const dv=o[j].v-o[i].v;if(dv>2)break;const dp=o[j].pos-o[i].pos;if(dp!==0&&Math.abs(dp)<=2*dv+1){if(dp>0)fw++;else bw++}}
  return{fw,bw};
}
/* หลักฐานตรงจากซองที่จด:
   1) อัตราการ “ขาดก้อน”: ซองที่จดเรียงตามตำแหน่ง ถ้าห่างกัน g ซองแล้วเลขก็ห่างกัน g พอดี (บวกหรือลบ) = ยังอยู่ก้อนเดียวกัน
      หาโอกาสขาดก้อนต่อซอง β ด้วย likelihood บนกริด → ความยาวก้อน ≈ 1/β
   2) ระยะของเลขต่อกัน: ก้อนปกติ เลขห่าง 1 อยู่ห่าง 1 ซองพอดี · แบ่งสองกอง เลขห่าง 1 มักอยู่ห่างราว 2 ซอง */
function styleEvidence(obs,N){
  const o=obs.slice().sort((a,c)=>a.pos-c.pos),gaps=[];
  for(let i=1;i<o.length;i++){const g=o[i].pos-o[i-1].pos,dv=o[i].v-o[i-1].v;if(g<=12)gaps.push({g,same:Math.abs(dv)===g})}
  const Bs=[0.005,0.01,0.02,0.035,0.05,0.07,0.1,0.14,0.2,0.3,0.45,0.65];
  const lw=Bs.map(b=>{let l=0;gaps.forEach(({g,same})=>{const keep=Math.pow(1-b,g);l+=same?Math.log(keep):Math.log(1-keep+1e-9)});return l});
  const m=Math.max(...lw);let W=0;const w=lw.map(x=>{const e=Math.exp(x-m);W+=e;return e});
  let pLong=0,bm=0;Bs.forEach((b,i)=>{w[i]/=W;bm+=w[i]*Math.log(b);if(1/b>=N/3)pLong+=w[i]});
  let e1=0,e2=0;const v=obs.slice().sort((a,c)=>a.v-c.v);
  for(let i=0;i<v.length;i++)for(let j=i+1;j<v.length;j++){const dv=v[j].v-v[i].v;if(dv>4)break;const dp=Math.abs(v[j].pos-v[i].pos),r=dp/dv;if(dp===dv)e1++;else if(r>=1.4&&r<=3)e2++}
  return{pLong,len:1/Math.exp(bm),e1,e2,ng:gaps.length,same:gaps.filter(x=>x.same).length};
}
function styleOf(E,obs,N){
  N=N||100;
  let pRand=0,pS2=0;(E.post.joint||[]).forEach(([c,fp,st,w])=>{if(c<=0.1)pRand+=w;else if(st===2)pS2+=w});
  const tot=(E.post.joint||[]).reduce((a,x)=>a+x[3],0)||1;pRand/=tot;pS2/=tot;
  const ev=styleEvidence(obs,N);
  // อัตราส่วน likelihood: แบ่งสองกอง คู่เลขใกล้กันมักห่าง ~2 ซอง (≈65%) · ก้อนปกติแทบไม่มี (≈8%)
  const pri=clamp(pS2/(1-pRand+1e-9),0.15,0.85);
  const lr=Math.exp(clamp(ev.e2*Math.log(0.65/0.08)+ev.e1*Math.log(0.35/0.92),-30,30));
  const pRif=(1-pRand)*(lr*pri/(lr*pri+1-pri));
  const rest=Math.max(0,1-pRand-pRif);
  const pr={none:rest*ev.pLong,blocks:rest*(1-ev.pLong),riffle:pRif,random:pRand};
  Object.keys(pr).forEach(k=>pr[k]=Math.round(pr[k]*1000)/1000);
  const k=Object.keys(pr).sort((a,c)=>pr[c]-pr[a])[0];
  const {fw,bw}=revPairs(obs),mi=Math.min(fw,bw),ma=Math.max(fw,bw);
  const rev=fw+bw>=4&&mi>=2&&mi/ma>=0.2;
  return{k,p:pr[k],pr,rev,fw,bw,len:Math.round(Math.min(N,ev.len)*10)/10,dir:Math.round(E.post.pDir*100)/100,n:obs.length,t:Date.now()};
}
/* วิธีสับที่บันทึกไว้ทุกรอบของร้าน (ใช้เป็นความรู้ล่วงหน้าของกระดานถัดไป) */
function shopStyleRounds(shop,skip){
  const out=[];
  S.boards.filter(x=>x.shop===shop).forEach(x=>{
    archOf(x).forEach((r,i)=>{if(r.style&&r.style.n>=8)out.push({b:x,round:i+1,st:r.style})});
    if(x.style&&x.style.n>=8&&x.id!==skip)out.push({b:x,round:archOf(x).length+1,st:x.style,cur:true});
  });
  return out;
}
function shopStyle(shop,skip){
  const rs=shopStyleRounds(shop,skip);if(!rs.length)return null;
  const pr={none:0,blocks:0,riffle:0,random:0},cnt={none:0,blocks:0,riffle:0,random:0};let W=0,lw=0,ls=0,rv=0;
  rs.forEach(({st})=>{const w=Math.min(1,st.n/20);W+=w;Object.keys(pr).forEach(k=>pr[k]+=w*(st.pr[k]||0));cnt[st.k]++;if(st.k!=='random'){ls+=w*st.len;lw+=w}if(st.rev)rv++});
  Object.keys(pr).forEach(k=>pr[k]/=W);
  const k=Object.keys(pr).sort((a,c)=>pr[c]-pr[a])[0];
  return{k,p:pr[k],pr,cnt,n:rs.length,len:lw?ls/lw:0,rev:rv,rounds:rs};
}
/* prior ของ “แบ่งสองกอง” = ข้อมูลร้าน + หลักฐานของรอบนี้ */
function pS2Of(b,obs){
  const sh=shopStyle(b.shop,b.id);let pr=0.375;
  if(sh){const w=Math.min(4,sh.rounds.reduce((a,r)=>a+Math.min(1,r.st.n/20),0));pr=clamp((0.375*2+w*sh.pr.riffle)/(2+w),0.1,0.85)}
  const ev=styleEvidence(obs,b.total);
  const lr=Math.exp(clamp(ev.e2*Math.log(0.65/0.08)+ev.e1*Math.log(0.35/0.92),-30,30));
  return Math.round(clamp(lr*pr/(lr*pr+1-pr),0.03,0.97)*1000)/1000;
}
const stName=k=>STYLE[k].ic+' '+STYLE[k].n;
const pctC=v=>Math.round(clamp(v,0,0.99)*100)+'%';
function styleBars(pr){return `<div class="stbars">${['blocks','none','riffle','random'].map(k=>`<div class="stb${pr[k]===Math.max(...Object.values(pr))?' on':''}"><span>${STYLE[k].n}</span><i style="width:${Math.round((pr[k]||0)*100)}%"></i><b>${pctC(pr[k]||0)}</b></div>`).join('')}</div>`}
function styleHTML(b,st){
  if(!st)return '';
  const few=st.n<10,conf=st.p>=0.75?'ค่อนข้างแน่':st.p>=0.5?'น่าจะ':'ยังก้ำกึ่ง';
  const det=[];
  if(st.k==='blocks'||st.k==='none'){const lo=Math.max(2,Math.round(st.len*0.7)),hi=Math.max(lo,Math.round(st.len*1.4));det.push(lo===hi?`ก้อนสั้น ราว ${lo} ซอง`:`ก้อนยาวราว ${lo}–${hi} ซอง`)}
  if(st.rev)det.push(`บางก้อนกลับหัว (เลขถอยหลัง ${Math.min(st.fw,st.bw)} คู่ จาก ${st.fw+st.bw})`);
  if(st.k!=='random'&&Math.abs(st.dir)>0.35)det.push(st.dir>0?'ส่วนใหญ่เลขเพิ่มไปทางขวา →':'ส่วนใหญ่เลขเพิ่มไปทางซ้าย ←');

/* ===== โมเดลคาดการณ์ =====
   เลข u น่าจะอยู่ใกล้ซองที่เปิดแล้วซึ่งมีเลขใกล้ u
   ถ้าเห็นเลข v ที่ตำแหน่ง p → u น่าอยู่ราว p ± (u-v) (ไปทางเดียวกับที่เลขเรียง)
   น้ำหนักลดลงตาม q^|u-v| (q = โอกาสที่เลขติดกันยังอยู่ติดกัน) */
function model(b){
  const N=b.total,P=params(b),obs=obsOf(b);
  const un=[];for(let x=1;x<=N;x++)if(!b.opened[x])un.push(x);
  const used=usedNums(b);
  const unseen=[];for(let u=1;u<=NM(b);u++)if(!used.has(u))unseen.push(u);
  const U=un.length;
  function dist(u){
    const p=new Float64Array(U);
    if(!U)return{p,M:0};
    let M=0;const comps=[];
    if(P.q>0)obs.forEach(o=>{const d=u-o.v,w=Math.pow(P.q,Math.abs(d));if(w<1e-3)return;M=Math.max(M,w);comps.push({w,c1:o.pos+d*P.step,c2:o.pos-d*P.step,s:0.7+0.12*Math.abs(d)*P.step})});
    M=Math.min(0.95,M);
    let tot=0;
    if(comps.length){un.forEach((x,i)=>{let s=0;comps.forEach(c=>{const a=(x-c.c1)/c.s,z=(x-c.c2)/c.s;s+=c.w*(P.fp*Math.exp(-a*a/2)+(1-P.fp)*Math.exp(-z*z/2))});p[i]=s;tot+=s})}
    if(tot<1e-9){p.fill(1/U);return{p,M:0}}
    for(let i=0;i<U;i++)p[i]=M*p[i]/tot+(1-M)/U;
    return{p,M};
  }
  const dc=new Map(),distC=u=>{if(!dc.has(u))dc.set(u,dist(u));return dc.get(u)};
  const HL=new Set(hitList(b)),remHits=unseen.filter(u=>HL.has(u));
  const H=remHits.length,base=U?Math.min(1,H/U):0;
  const miss=new Float64Array(U).fill(1),perHit=[];
  remHits.forEach(u=>{
    const {p,M}=distC(u);let best=0;
    for(let i=0;i<U;i++){miss[i]*=(1-p[i]);if(p[i]>p[best])best=i}
    if(M>0.12){
      let mu=0,sw=0;p.forEach((v,i)=>{const e=v-(1-M)/U;if(e>0){mu+=e*un[i];sw+=e}});mu/=sw;
      let vr=0;p.forEach((v,i)=>{const e=v-(1-M)/U;if(e>0)vr+=e*(un[i]-mu)**2});const sd=Math.sqrt(vr/sw);
      const c=un[best],r=Math.max(1,Math.round(Math.min(sd,N/6)));
      let conf=0;un.forEach((x,i)=>{if(x>=c-r&&x<=c+r)conf+=p[i]});
      const lo=Math.max(1,c-r),hi=Math.min(N,c+r);
      const rangeN=un.filter(x=>x>=lo&&x<=hi).length;
      const clues=obs.map(o=>({v:o.v,pos:o.pos,d:u-o.v,w:Math.pow(P.q,Math.abs(u-o.v))})).filter(o=>o.w>0.03).sort((a,z)=>z.w-a.w).slice(0,2);
      perHit.push({n:u,center:c,lo,hi,conf,rangeN,rnd:rangeN/U,clues});
    }
  });
  const prob={};let mx=0,mn=1;
  un.forEach((x,i)=>{prob[x]=H?1-miss[i]:0;mx=Math.max(mx,prob[x]);mn=Math.min(mn,prob[x])});
  const spread=mx>mn*1.08&&mx>0;
  const top=spread?un.slice().sort((a,c)=>prob[c]-prob[a]).slice(0,6):[];
  function guess(x){ // เลขที่น่าจะอยู่ในซอง x
    const i=un.indexOf(x);if(i<0||!obs.length||P.q<=0)return null;
    const sc=unseen.map(u=>({u,p:distC(u).p[i]})).sort((a,c)=>c.p-a.p);
    const top3=sc.slice(0,3),sum=top3.reduce((a,c)=>a+c.p,0);
    if(top3[0].p<1.5/U)return null;
    return{nums:top3.map(t=>t.u).sort((a,c)=>a-c),sum,ranked:top3.map(t=>[t.u,t.p])};
  }
  return{N,H,U,base,prob,mx,mn,spread,top,perHit,P,guess,obsN:obs.length,un,unseen,nUnseen:unseen.length,dist:distC,idx:new Map(un.map((x,i)=>[x,i]))};
}
function rangeText(b,p){
  const bx=boxOf(b,p.center),r=remainIn(b,bx);
  const ks=r.map((x,i)=>x>=p.lo&&x<=p.hi?i:-1).filter(i=>i>=0);
  if(!ks.length)return`${boxPrefix(b,bx)}ตำแหน่งเดิม #${p.lo}–${p.hi}`;
  // รวมเป็นช่วงติดกัน (ซองที่ถูกย้ายมาเติมอาจแยกออกไปอยู่ที่อื่น)
  const runs=[];ks.forEach(k=>{const l=runs[runs.length-1];if(l&&k-l[1]<=1)l[1]=k;else runs.push([k,k])});
  const f=([a,z])=>a===z?`${a+1}`:`${a+1}–${z+1}`, g=([a,z])=>a===z?`${r.length-a}`:`${r.length-z}–${r.length-a}`;
  return `${boxPrefix(b,bx)}ซองที่ <b>${runs.map(f).join(', ')}</b> จากซ้าย <span class="muted">(${runs.slice().reverse().map(g).join(', ')} จากขวา)</span>`;
}
function groupHits(b,list){
  const m=new Map();
  list.forEach(p=>{const t=rangeText(b,p);if(!m.has(t))m.set(t,{ns:[],conf:0,p});const g=m.get(t);g.ns.push(p.n);if(p.conf>g.conf){g.conf=p.conf;g.p=p}});
  return [...m].map(([txt,g])=>({txt,conf:g.conf,p:g.p,names:g.ns.length>2?`${pad(g.ns[0])}–${pad(g.ns[g.ns.length-1])}`:g.ns.map(n=>esc(hitName(b,n))).join(', ')}));
}
/* เหตุผลของตัวเลข “มั่นใจ %” */
function whyHTML(b,p,P){
  const st=P.st,u=p.n,lines=[];
  p.clues.forEach((c,i)=>{
    const ad=Math.abs(c.d),dist=Math.max(1,Math.round(ad*P.step));
    let dir;
    if(st.close>=2&&(P.fp>=0.65||P.fp<=0.35)){
      const right=(c.d>0)===(P.fp>=0.65);
      dir=`ร้านนี้เลขมักเพิ่มขึ้นไปทาง${P.fp>=0.65?'ขวา':'ซ้าย'} ${pad(u)} ${c.d>0?'มากกว่า':'น้อยกว่า'} ${pad(c.v)} จึงน่าอยู่ทาง<b>${right?'ขวา':'ซ้าย'}</b>ของซองนั้นประมาณ ${dist} ซอง`;
    }else dir=`ยังไม่รู้ว่าเลขเรียงไปทางไหน แอปเลยเผื่อไว้ทั้งซ้ายและขวาของซองนั้นประมาณ ${dist} ซอง`;
    lines.push(`${i?'อีกเบาะแส: ':''}เลข <b>${pad(c.v)}</b> ออกที่ซองตำแหน่งเดิม #${c.pos} ซึ่งห่างจาก ${pad(u)} ${ad<=3?'แค่':''} ${ad} เลข · ${dir}`);
  });
  const ratio=p.rnd>0?p.conf/p.rnd:0;
  lines.push(`ถ้าซองเรียงแบบสุ่มล้วน ช่วงนี้ (${p.rangeN} ซอง) จะมีโอกาสแค่ ${pct(p.rnd)} ตอนนี้ ${pct(p.conf)} = <b>สูงกว่าสุ่ม ${ratio.toFixed(1)} เท่า</b>`);
  const lim=[];
  if(st.n<6)lim.push(`ข้อมูลคู่เลขยังน้อย (${st.n} คู่)`);
  if(P.q<0.5)lim.push(`ร้านนี้สับพอใช้ (ดัชนี ${Math.round(P.q*100)}%) เลขที่ใกล้กันไม่ได้อยู่ใกล้กันเสมอ`);
  const best=p.clues[0];if(best&&Math.abs(best.d)>=3)lim.push(`เลขที่ใกล้ที่สุดยังห่างไป ${Math.abs(best.d)} เลข ยิ่งห่างยิ่งเดายาก`);
  if(!(st.close>=2&&(P.fp>=0.65||P.fp<=0.35)))lim.push('ยังไม่รู้ทิศที่เลขเรียง ต้องเผื่อสองข้าง ช่วงเลยกว้าง');
  if(b.refill&&/,/.test(rangeText(b,p)))lim.push('มีซองที่ร้านย้ายมาเติม ช่วงเลยแตกเป็นหลายจุด');
  if(lim.length)lines.push(`ที่ยังไม่สูงกว่านี้เพราะ: ${lim.join(' · ')}`);
  return `<details class="why"><summary>ทำไมมั่นใจ ${pct(p.conf)}?</summary><ul>${lines.map(l=>`<li>${l}</li>`).join('')}</ul></details>`;
}

function shopList(){
  if(!Array.isArray(S.shops))S.shops=[];
  S.boards.forEach(b=>{if(!S.shops.includes(b.shop))S.shops.push(b.shop)});
  return S.shops;

function boardChance(b){
  if(b.closed)return null;
  const R=mergeEngine(b,model(b),false);if(!R.U||!R.H)return{R,best:null};
  const x=R.spread?R.top[0]:null;
  return{R,best:x?{x,p:R.prob[x],lr:lr(b,x)}:null};
}
const pctOr=v=>v==null?'–':pct(v);

/* ===== J Hunter Engine: Bayesian HMM =====
   1) โมเดล: เลขในกล่องเรียงตามตำแหน่งเดิมเป็น Hidden Markov Model
      P(เลขซองถัดไป = v' | ซองนี้ = v) = (1−c)/N + c·h(v'−v)
      h(d) = ทิศ (fp ถ้าเลขเพิ่ม, 1−fp ถ้าเลขลด) · (1−λ)λ^(|d|−1)/Z  สำหรับ 1≤|d|≤K
   2) forward–backward หาโอกาสของทุกเลขในทุกซอง แบบคำนวณตรง (ไม่ต้องสุ่ม)
   3) Bayesian model averaging: ไม่เดาค่า c, fp, λ ค่าเดียว แต่ถ่วงทุกค่าบนกริดตาม posterior
   4) Sinkhorn: ปรับเมทริกซ์ให้ “หนึ่งซองหนึ่งเลข และหนึ่งเลขหนึ่งซอง” (เงื่อนไขการเรียงสับเปลี่ยน) */
function jhEngine(I){
  // N = จำนวนซอง (ตำแหน่ง), M = ช่วงเลขทั้งหมด (หลังร้านสับใหม่ ซองเหลือน้อยกว่าช่วงเลข)
  const N=I.N,M=I.M||I.N,K=6,NP=N+1,VP=M+1;
  const known=new Int32Array(NP),isHit=new Uint8Array(VP),used=new Uint8Array(VP),noHit=new Uint8Array(NP);
  I.known.forEach(([p,v])=>{known[p]=v;used[v]=1});
  (I.excl||[]).forEach(v=>{if(v>=1&&v<=M)used[v]=1});
  I.hits.forEach(h=>{if(h>=1&&h<=M)isHit[h]=1});
  I.noHit.forEach(p=>noHit[p]=1);
  const allow=new Float64Array(NP*VP);
  for(let p=1;p<=N;p++){
    if(known[p]){allow[p*VP+known[p]]=1;continue}
    for(let v=1;v<=M;v++)if(!used[v]&&!(noHit[p]&&isHit[v]))allow[p*VP+v]=1;
  }
  const alpha=new Float64Array(NP*VP),beta=new Float64Array(NP*VP),tmp=new Float64Array(VP),h=new Float64Array(2*K+1);
  // ลำดับโซ่: stride 1 = ซองติดกัน, stride 2 = เลขต่อกันแบบเว้นทีละซอง (สับแบบแบ่งสองกองแล้วสลับเข้าหากัน)
  const chainsOf=st=>{const cs=[];for(let k=0;k<st;k++){const a=[];for(let p=1+k;p<=N;p+=st)a.push(p);if(a.length)cs.push(a)}return cs};
  function run(c,fp,lam,st,wantPost){
    const Z=(1-lam)/(1-Math.pow(lam,K));
    for(let d=-K;d<=K;d++){const a=Math.abs(d);h[d+K]=a===0?0:(d>0?fp:1-fp)*Z*Math.pow(lam,a-1)}
    const u=(1-c)/M;let logL=0;const g=wantPost?new Float64Array(NP*VP):null;
    for(const seq of chainsOf(st)){
      const L=seq.length;
      let s=0,o0=seq[0]*VP;for(let v=1;v<=M;v++){alpha[o0+v]=allow[o0+v]/M;s+=alpha[o0+v]}
      if(!(s>0))return{logL:-1e300};

          const x=(u+c*band)*al;alpha[cur+v]=x;tot+=x}
        if(!(tot>0))return{logL:-1e300};

      if(!wantPost)continue;

      for(let i=L-2;i>=0;i--){

        let tot=0;
        for(let v=1;v<=M;v++){let band=0;for(let d=-K;d<=K;d++){const w=v+d;if(w>=1&&w<=M)band+=tmp[w]*h[d+K]}

        for(let v=1;v<=M;v++)beta[cur+v]/=tot;

  const Cs=I.fixC!=null?[I.fixC]:[0.02,0.1,0.22,0.36,0.5,0.64,0.78,0.92];

  const grid=[];
  for(const st of Ss)for(const c of Cs)for(const fp of Fs)for(const lam of Ls){const r=run(c,fp,lam,st,false);grid.push({c,fp,lam,st,lw:r.logL+lp(c,P.ca,P.cb)+lp(fp,fpP.a,fpP.b)+(st===1?Math.log(1-(I.pS2||0.375)):Math.log(I.pS2||0.375))})}
  const mx=Math.max(...grid.map(x=>x.lw));let W=0;grid.forEach(x=>{x.w=Math.exp(x.lw-mx);W+=x.w});grid.forEach(x=>x.w/=W);
  const G=new Float64Array(NP*VP);let used_w=0;
  grid.slice().sort((a,b)=>b.w-a.w).forEach(x=>{if(x.w<0.004&&used_w>0.98)return;const r=run(x.c,x.fp,x.lam,x.st,true);for(let i=0;i<G.length;i++)G[i]+=x.w*r.g[i];used_w+=x.w});
  // Sinkhorn: แต่ละซองมีหนึ่งเลข / แต่ละเลขที่เหลืออยู่ได้ไม่เกินหนึ่งซอง (ถ้าเลขมากกว่าซอง คอลัมน์รวม = ซอง/เลข)
  const fpos=[],fval=[];for(let p=1;p<=N;p++)if(!known[p])fpos.push(p);for(let v=1;v<=M;v++)if(!used[v])fval.push(v);
  if(fpos.length&&fval.length){
    const colT=Math.min(1,fpos.length/fval.length);
    for(let it=0;it<30;it++){
      for(const p of fpos){let t=0;for(const v of fval)t+=G[p*VP+v];if(t>0)for(const v of fval)G[p*VP+v]/=t}

  for(const p of fpos){if(noHit[p])continue;let s=0;for(const v of fval)if(isHit[v])s+=G[p*VP+v];phit[p]=Math.min(1,s)}
  const marg=(key,vals)=>vals.map(x=>({x,w:grid.filter(g=>g[key]===x).reduce((a,g)=>a+g.w,0)}));
  const cm=marg('c',Cs),fm=marg('fp',Fs),lm=marg('lam',Ls),sm=marg('st',Ss);
  const mean=m=>m.reduce((a,o)=>a+o.x*o.w,0);
  const q=(m,t)=>{let a=0;for(const o of m){a+=o.w;if(a>=t)return o.x}return m[m.length-1].x};
  return{G,VP,M,phit,fpos,fval,post:{c:mean(cm),cLo:q(cm,0.05),cHi:q(cm,0.95),cDist:cm,fp:mean(fm),lam:mean(lm),pStride2:(sm.find(o=>o.x===2)||{w:0}).w,pDir:fm.filter(o=>o.x>0.5).reduce((a,o)=>a+o.w,0)-fm.filter(o=>o.x<0.5).reduce((a,o)=>a+o.w,0),joint:(()=>{const m=new Map();grid.forEach(g=>{const k=g.c+'|'+g.fp+'|'+g.st;m.set(k,(m.get(k)||0)+g.w)});return [...m].filter(([k,w])=>w>1e-4).map(([k,w])=>{const [c,fp,st]=k.split('|').map(Number);return[c,fp,st,w]})})()}};
}


/* ===== เครื่องคำนวณแบบเบย์ (ทำงานเบื้องหลังใน Web Worker) ===== */
const ENG={cache:new Map(),busy:null,queue:null,worker:null,failed:false};
function histPairs(b){
  // กระดานเก่าของร้าน + รอบก่อนสับใหม่ของกระดานนี้ = นิสัยการสับที่รู้มาก่อน
  return S.boards.filter(x=>x.shop===b.shop&&x.closed&&x.id!==b.id).map(pairCount).reduce(addP,archPairs(b));
}
function engInput(b){
  const m=b.mode||'auto';if(m==='off')return null;
  const obs=obsOf(b);if(!obs.length)return null;
  const noHit=Object.entries(b.opened).filter(([k,o])=>val(o)==null).map(([k])=>+k);
  const h=histPairs(b);let ca=1,cb=1;
  if(h.n>=3){const m0=clamp((h.sk+1)/(h.sk+(h.n-h.close)+3),0.05,0.9),k=Math.min(20,2+h.n);ca=1+k*m0;cb=1+k*(1-m0)}

  let fpPrior=null;if(h.close>=3){const f=clamp((h.fw+1)/(h.close+2),0.1,0.9),k=Math.min(6,h.close/2);fpPrior={a:1+k*f,b:1+k*(1-f)}}
  const fixC={low:0.3,mid:0.55,high:0.8}[m];
  const inp={N:b.total,M:NM(b),excl:[...archNums(b).keys()].sort((a,c)=>a-c),hits:hitList(b),known:obs.map(o=>[o.pos,o.v]).sort((a,c)=>a[0]-c[0]),noHit:noHit.sort((a,c)=>a-c),prior:{ca,cb},fixC:fixC==null?null:fixC,hist:h.n};
  if(fpPrior)inp.fpPrior=fpPrior;
  inp.pS2=pS2Of(b,obs);

}
function engWorker(){
  if(ENG.worker||ENG.failed)return ENG.worker;
  try{
    const src=jhEngine.toString()+';onmessage=e=>{const r=jhEngine(e.data.inp);postMessage({key:e.data.key,r:{phit:r.phit,G:r.G,VP:r.VP,M:r.M,fpos:r.fpos,fval:r.fval,post:r.post}})}';
    ENG.worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    ENG.worker.onmessage=e=>engDone(e.data.key,e.data.r);
    ENG.worker.onerror=()=>{ENG.failed=true;ENG.worker=null;const j=ENG.busy;ENG.busy=null;if(j)engRun(j)};
  }catch(e){ENG.failed=true;ENG.worker=null}
  return ENG.worker;
}
function engRun(job){
  ENG.busy=job;const w=engWorker();
  if(w)w.postMessage(job);
  else setTimeout(()=>{let r;try{r=jhEngine(job.inp)}catch(e){r=null}engDone(job.key,r)},30);
}
function engDone(key,r){
  if(r){ENG.cache.set(key,r);if(ENG.cache.size>12)ENG.cache.delete(ENG.cache.keys().next().value)}
  ENG.busy=null;
  if(ENG.queue){const q=ENG.queue;ENG.queue=null;if(!ENG.cache.has(q.key))engRun(q)}
  if(typeof rerender==='function')rerender();else route();
}
function getEngine(b,start=true){
  const inp=engInput(b);if(!inp)return null;
  const key=JSON.stringify(inp);
  if(ENG.cache.has(key))return ENG.cache.get(key);
  if(!start)return null;
  const job={key,inp};
  if(ENG.busy){if(ENG.busy.key!==key)ENG.queue=job}else engRun(job);
  return{pending:true};
}
/* รวมผลเครื่องคำนวณแบบเบย์เข้ากับโมเดลเดิม (linear opinion pool)
   น้ำหนักเริ่มที่ 70:30 แล้วปรับเองจากผลทายจริงของร้าน (โมเดลไหนทายฮิตแม่นกว่า ได้น้ำหนักมากกว่า) */
const W_BAYES=0.7;
const _bw={k:null,v:null};
function blendW(b){
  const recs=[];
  S.boards.filter(x=>x.shop===b.shop).forEach(x=>[{opened:x.opened,pred:x.pred},...archOf(x)].forEach(r=>{
    const P=r.pred||{};Object.keys(P).forEach(k=>{const q=P[k],o=(r.opened||{})[k];if(!o||q.pe==null||q.pH==null)return;recs.push([q.pe,q.pH,isHitV(x,val(o))?1:0])})}));
  const key=b.shop+'|'+recs.length+'|'+recs.reduce((a,r)=>a+r[2],0);
  if(_bw.k===key)return _bw.v;
  let out={w:W_BAYES,n:recs.length,hits:recs.reduce((a,r)=>a+r[2],0),learned:false};
  if(recs.length>=15&&out.hits>=3){
    const Ws=[0.3,0.45,0.6,0.7,0.8,0.9,1];let best=null;
    Ws.forEach(w=>{let ll=-Math.pow(w-W_BAYES,2)/(2*0.2*0.2);recs.forEach(([e,h,y])=>{const p=clamp(w*e+(1-w)*h,0.002,0.998);ll+=y?Math.log(p):Math.log(1-p)});if(!best||ll>best.ll)best={w,ll}});
    out.w=best.w;out.learned=true;

/* โอกาสที่เลข u อยู่ในซอง x (ไม่มีเงื่อนไข: รวมโอกาสที่เลขนั้นไม่อยู่ในกล่องแล้วด้วย) */
function pOfNum(R,x,u){
  let hp=0;
  if(R.dist&&R.idx.has(x)){const d=R.dist(u);hp=d.p[R.idx.get(x)]*Math.min(1,R.U/Math.max(1,R.nUnseen))}
  if(!R.E)return hp;
  return R.W*R.E.G[x*R.E.VP+u]+(1-R.W)*hp;
}
/* เลข u น่าอยู่ช่วงไหน: หาช่วงซองติดกันสั้นที่สุด (≤8 ซอง) ที่โอกาสเกินกว่าสุ่มมากที่สุด */
function locOf(b,R,u){
  const un=R.un||[];if(!un.length)return null;
  const arr=un.map(x=>({x,p:pOfNum(R,x,u)}));
  let tot=0;arr.forEach(o=>tot+=o.p);if(!(tot>0))return null;
  arr.forEach(o=>o.p/=tot);
  const byPos=arr.slice().sort((a,c)=>a.x-c.x);let best=null;
  for(let w=1;w<=Math.min(8,byPos.length);w++){
    let m=0;for(let i=0;i<w;i++)m+=byPos[i].p;let bm=m,bi=0;
    for(let i=w;i<byPos.length;i++){m+=byPos[i].p-byPos[i-w].p;if(m>bm){bm=m;bi=i-w+1}}
    const ex=bm-w/Math.max(1,R.U);
    if(!best||ex>best.ex)best={w,bi,m:bm,ex};
    if(bm>=0.5)break;
  }
  const lo=byPos[best.bi].x,hi=byPos[best.bi+best.w-1].x;
  arr.sort((a,c)=>c.p-a.p);
  const clues=obsOf(b).map(o=>({v:o.v,pos:o.pos,d:u-o.v})).sort((a,c)=>Math.abs(a.d)-Math.abs(c.d)||a.pos-c.pos).slice(0,2);
  return{n:u,center:arr[0].x,lo,hi,conf:best.m,rangeN:best.w,rnd:best.w/Math.max(1,R.U),clues,peak:arr[0].p,inBox:Math.min(1,tot),top:arr.slice(0,5).map(o=>({x:o.x,p:o.p*Math.min(1,tot)}))};
}
function mergeEngine(b,R,start=true){
  const E=getEngine(b,start);
  R.W=0;
  if(!E)return R;
  if(E.pending){R.pending=true;return R}
  const G=E.G,VP=E.VP||(b.total+1);if(!E.VP)E.VP=VP;
  const BW=blendW(b);R.W=BW.w;R.BW=BW;
  const un=R.un;
  R.E=E;R.probH={};let mx=0,mn=1;
  un.forEach(x=>{R.probH[x]=R.prob[x];R.prob[x]=R.H?R.W*E.phit[x]+(1-R.W)*R.prob[x]:0;mx=Math.max(mx,R.prob[x]);mn=Math.min(mn,R.prob[x])});
  R.mx=mx;R.mn=mn;R.spread=mx>mn*1.08&&mx>0;
  R.top=R.spread?un.slice().sort((a,c)=>R.prob[c]-R.prob[a]).slice(0,6):[];
  const used=usedNums(b);
  R.perHit=hitList(b).filter(u=>!used.has(u)).map(u=>locOf(b,R,u)).filter(p=>p&&p.conf>=0.15&&p.conf/Math.max(1e-9,p.rnd)>=1.6);
  R.diffuse=hitList(b).filter(u=>!used.has(u)&&!R.perHit.some(p=>p.n===u));
  R.guessP=x=>{
    const row=E.fval.map(u=>({u,p:G[x*VP+u]})).sort((a,c)=>c.p-a.p).slice(0,3);
    return row[0]&&row[0].p>1.5/Math.max(1,E.fval.length)?row:null;
  };

}
function dirInfo(E){const d=E.post.pDir;return d>0.35?{k:1,t:'เลขมักเพิ่มขึ้นไปทางขวา →',conf:(d+1)/2}:d<-0.35?{k:-1,t:'เลขมักเพิ่มขึ้นไปทางซ้าย ←',conf:(1-d)/2}:{k:0,t:'ยังไม่รู้ว่าเลขเรียงไปทางไหน',conf:0.5}}
const strideOf=E=>E.post.pStride2>0.5?2:1;
const pctI=v=>Math.round(v*100)+'%';
function engLevel(E){
  const c=E.post.c,lo=E.post.cLo,hi=E.post.cHi,w=hi-lo;
  const conf=w<=0.2?'ค่อนข้างแน่น':w<=0.4?'พอเชื่อได้':'ข้อมูลยังน้อย';
  const key=c<0.15?'off':c<0.35?'low':c<0.6?'mid':'high';
  const name={off:'ใกล้เคียงสุ่ม',low:'ต่ำ',mid:'กลาง',high:'สูง'}[key];

function nearKnown(b,x){

  return{L,R:Rr};
}
/* เหตุผลของซองที่แนะนำ */
function whyPack(b,x,R){

  if(L&&x-L.pos<=12)near.push(`ทางซ้าย #${L.pos} (ห่าง ${x-L.pos} ซอง) = <b>${numLabel(b,L.v)}</b>`);
  if(Rr&&Rr.pos-x<=12)near.push(`ทางขวา #${Rr.pos} (ห่าง ${Rr.pos-x} ซอง) = <b>${numLabel(b,Rr.v)}</b>`);
  if(near.length)lines.push(`ซองใกล้ ๆ ที่เปิดแล้ว: ${near.join(' · ')}`);
  else lines.push('ยังไม่มีซองที่เปิดแล้วอยู่ใกล้ซองนี้ (ภายใน 12 ซอง) ผลนี้มาจากภาพรวมทั้งกล่อง');
  if(D.k){
    const est=[];
    if(L&&x-L.pos<=12){const v=Math.round(L.v+D.k*(x-L.pos)/st);if(v>=1&&v<=NM(b))est.push(`นับต่อจากซองซ้าย → ราว ${pad(v)}`)}

    if(est.length)lines.push(`ร้านนี้${D.t.replace('เลขมัก','เลขมัก')} (มั่นใจ ${pctI(D.conf)})${st===2?' และเลขต่อกันมักเว้นทีละซอง':''}: ${est.join(' · ')}`);

  return `<details class="why" onclick="event.stopPropagation()"><summary>เหตุผล</summary><ul>${lines.map(l=>`<li>${l}</li>`).join('')}</ul></details>`;

/* เหตุผลของตำแหน่งฮิตแต่ละใบ (เวอร์ชันเบย์) */
function whyHitE(b,p,R){

    const ad=Math.abs(c.d),dist=Math.max(1,Math.round(ad*st));
    const side=D.k?(((c.d>0)===(D.k>0))?'ขวา':'ซ้าย'):null;
    lines.push(`${i?'อีกเบาะแส: ':''}เลข <b>${pad(c.v)}</b> อยู่ที่ซองเดิม #${c.pos} ห่างจาก ${pad(u)} ${ad<=3?'แค่':''} ${ad} เลข${side?` · ${D.t} จึงน่าอยู่ทาง<b>${side}</b>ของซองนั้นราว ${dist} ซอง`:` · ${D.t} เลยเผื่อไว้ทั้งสองข้างราว ${dist} ซอง`}`);
  });

function rankIn(R,map,x){if(!R.un)return null;const v=map[x];let k=0;R.un.forEach(y=>{if(map[y]>v+1e-12)k++});return k}

  if(UI.pick&&UI.pick.x===x)s.side=UI.pick.s;

}

  if(G.tgt&&G.P.tg&&G.P.tg.rk!=null&&G.P.tg.rk<5)a.push('<span class="gb">🔎 เจอเลขที่ตามล่า</span>');

function roundsOf(b){return [...archOf(b).map((r,i)=>({cfg:r,opened:r.opened||{},pred:r.pred||{},seq:r.seq||Object.keys(r.opened||{}).map(Number),round:i+1,arch:true})),{cfg:b,opened:b.opened,pred:b.pred||{},seq:seqOf(b),round:archOf(b).length+1,arch:false}]}
function nearSize(g,seen,M){const t=g[0][0],st=new Set();for(let d=-2;d<=2;d++){const u=t+d;if(u>=1&&u<=M&&!seen.has(u))st.add(u)}g.forEach(o=>{if(!seen.has(o[0]))st.add(o[0])});return Math.max(1,st.size)}
function scoreOf(bs){
  const s={n:0,ex:0,nr:0,rEx:0,rNr:0,nh:0,ct:0,rCt:0,nt:0,tt:0,rT:0,recs:0};
  bs.forEach(b=>{const seen=new Set();roundsOf(b).forEach(r=>{
    // เลขที่ออกไปแล้วก่อนซองนี้ (ใช้คิดโอกาสเดามั่วให้ถูก: เดาได้เฉพาะเลขที่ยังไม่ออก)

/* ===== ป้ายประวัติ: “ซ้าย 7 (#8)” — # คือตำแหน่งเดิมของซอง ส่วนซ้าย/ขวาคือที่นับตอนหยิบ ===== */
const _rp=new Map();

  seq.forEach(x=>{const bi=BX.findIndex(bx=>x>=bx.from&&x<=bx.to);if(bi<0)return;const a=arr[bi],i=a.indexOf(x);if(i<0)return;

      if(si<sl){const m=a.pop();a.splice(cfg.refillAt==='end'?Math.min(a.length,(si+1)*sec-1):i,0,m)}}});

  const nums=(b.target||[]).filter(u=>u>=1&&u<=NM(b));if(!nums.length||!R.un)return null;

  nums.forEach(u=>{if(used.has(u)){const at=used.get(u);gone.push({u,at,round:at===0?archNums(b).get(u).round:null});return}out.push({u,L:locOf(b,R,u)})});

function reshuffle(){
  const b=getB(S.cur),o=Object.keys(b.opened).length,left=b.total-o;
  if(!o){toast('รอบนี้ยังไม่มีซองที่เปิด');return}
  if(left<2){toast('ซองเหลือน้อยเกินไป');return}
  ask(`ร้านเอาซองที่เหลือ <b>${left} ซอง</b> ไปสับใหม่?<br><span class="small muted">ข้อมูลรอบนี้จะเก็บไว้ (ใช้เรียนรู้นิสัยการสับของร้านต่อ) · กล่องใหม่นับซอง 1–${left} ใหม่ · เลขที่ออกไปแล้วจะไม่ถูกนับอีก · กด “ย้อนกลับ” ได้ถ้ากดผิด</span>`,'ร้านสับใหม่',()=>{
    const snap=JSON.parse(JSON.stringify({total:b.total,opened:b.opened,seq:seqOf(b),pred:b.pred||{},boxN:b.boxN||0,boxPer:b.boxPer||0,archive:archOf(b),numMax:b.numMax||0,style:b.style||null}));
    const r={style:b.style||null,total:b.total,opened:b.opened,seq:seqOf(b).slice(),pred:b.pred||{},boxN:b.boxN||0,boxPer:b.boxPer||0,sec:b.sec||0,refill:!!b.refill,refillAt:b.refillAt||'gap',at:Date.now()};
    b.numMax=NM(b);b.archive=archOf(b).concat([r]);b.total=left;b.opened={};b.seq=[];b.pred={};delete b.style;
    b.boxPer=0;if(left<=PER)b.boxN=0;
    b.log=[{rs:snap}];UI.sel=null;UI.box=0;save();toast(`เริ่มรอบ ${b.archive.length+1}: กล่องใหม่ ${left} ซอง`);renderBoard('pos');
  });
}

function shopCard(shop){
  const bs=S.boards.filter(b=>b.shop===shop),act=bs.filter(b=>!b.closed);
  let top=null;
  act.forEach(b=>{const c=boardChance(b);const p=c&&c.R.U?(c.best?c.best.p:c.R.base):null;if(p!=null&&(!top||p>top.p))top={p,b}});
  const st=shuffleStats(null,shop);
  return `<button class="card click" onclick="openShop(${JSON.stringify(shop).replace(/"/g,'&quot;')})">
    <div class="row" style="justify-content:space-between"><div class="t" style="font-size:17px">${esc(shop)}</div>
    ${top?`<div style="text-align:right"><div class="num" style="font-size:22px;font-weight:700;color:var(--gold2)">${pct(top.p)}</div><div class="small muted">โอกาสดีสุด · ${esc(top.b.name)}</div></div>`:''}</div>
    <div class="small muted" style="margin-top:4px">กำลังเล่น ${act.length} กระดาน · ปิดแล้ว ${bs.length-act.length} กระดาน</div>
    <div class="small" style="margin-top:4px">${shuffleText(st)}</div>${(()=>{const sh=shopStyle(shop);return sh?`<div class="small" style="margin-top:4px;color:var(--gold2)">🧩 มักสับแบบ: ${STYLE[sh.k].n} ${pctC(sh.p)} <span class="muted">(${sh.n} รอบ)</span></div>`:''})()}</button>`;
}

function saveShop(old){

function delShop(name){

function boardCard(b,c){
  const f=foundHitsAll(b).length,o=Object.keys(b.opened).length,U=b.total-o,H=hitList(b).length-f;

  }
  return `<div class="card click bcard" role="button" tabindex="0" onclick="openBoard('${b.id}')" onkeydown="if(event.key==='Enter')openBoard('${b.id}')">

    <div class="progress"><i style="width:${(o/b.total*100).toFixed(1)}%"></i></div>
    <div class="muted small num">เหลือ ${U}/${b.total} ซอง · ฮิตเหลือ ${H}/${hitList(b).length}${b.closed?'':` · จดแล้ว ${o} ซอง`}</div>
    <div class="row bc-acts">${b.closed?`<button class="btn sm" onclick="event.stopPropagation();reopenId('${b.id}')">เปิดกระดานอีกครั้ง</button>`:''}<button class="btn sm red" onclick="event.stopPropagation();delBoardId('${b.id}')">ลบกระดาน</button></div></div>`;

function createBoard(){

  else hitCount=clamp(parseInt($('#nHits').value)||1,1,Math.min(99,total));

/* ===== หน้ากระดาน ===== */
function openBoard(id){S.cur=id;UI.sel=null;UI.box=0;save();renderBoard('pos')}
function renderBoard(focus){setTimeout(()=>window.paintSync&&paintSync(),0);
  const b=getB(S.cur);if(!b)return renderHome();
  const R=mergeEngine(b,model(b)),BX=boxes(b),st=R.P.st;
  if(UI.box>=BX.length)UI.box=0;
  const T=targetInfo(b,R),EV=evInfo(b,R);
  // จำแนกวิธีสับของรอบนี้ แล้วเก็บไว้เป็นข้อมูลร้าน (เฉพาะโหมดอัตโนมัติ)
  let STY=b.style||null;
  if(R.E&&(b.mode||'auto')==='auto'&&R.obsN>=6){const ns=styleOf(R.E,obsOf(b),b.total);
    if(!STY||STY.n!==ns.n||STY.k!==ns.k||Math.abs(STY.p-ns.p)>0.03){b.style=ns;STY=ns;save()}else STY=b.style}
  if(STY&&!R.obsN)STY=null;
  const RB=b.rankBy==='target'&&T&&T.out.length?'target':b.rankBy==='ev'&&EV?'ev':'hit';
  const heatOf=RB==='target'?(x=>T.spread?(T.pt[x]-T.mn)/(T.mx-T.mn):0):RB==='ev'?(x=>EV.spread?(EV.ev[x]-EV.mn)/(EV.mx-EV.mn):0):(x=>R.spread?(R.prob[x]-R.mn)/(R.mx-R.mn):0);
  const ranked=RB==='target'?T.top:RB==='ev'?(EV.spread?EV.top:[]):R.top;
  const PO=physOrder(b),sec=b.sec||0,DIV='<div class="dv"></div>',HDV='<div class="hdv"></div>';
  const boxHTML=BX.map(bx=>{
    let heat='',sl='';
    // โหมดเติมซอง: แสดงลำดับจริงในกล่อง · โหมดปกติ: แสดงช่องเดิม (ซองที่เปิดแล้วเป็นช่องว่าง)
    const slots=b.refill?PO[bx.i]:Array.from({length:bx.to-bx.from+1},(_,j)=>bx.from+j);
    slots.forEach((x,j)=>{
      if(sec&&j>0&&(b.refill?j%sec===0:(x-bx.from)%sec===0)){sl+=DIV;heat+=HDV}
      const o=b.opened[x],sel=UI.sel===x?' sel':'';
      if(o){
        const v=val(o),h=isHitV(b,v),G=gradeOf(b,b.opened,b.pred,x);
        heat+='<div class="hb z"></div>';
        sl+=`<div class="slg${h?' hit':''}${gCls(G)}${sel}" data-p="${x}" title="${v==null?'เกลือ':pad(v)}${G&&G.exact?' · ทายตรง':G&&G.near?' · ทายใกล้':''}${G&&G.caught?' · จับฮิต':''}"></div>`;
      }else{
        const h=heatOf(x);
        heat+=h>0.02?`<div class="hb" style="--v:${Math.round(h*100)}%;--v-n:${h.toFixed(2)}"></div>`:'<div class="hb z"></div>';
        sl+=`<div class="sl${h>0.5?' hot':''}${sel}" style="--h:${h.toFixed(2)}" data-p="${x}"></div>`;
      }
    });
    const left=remainIn(b,bx).length;
    return `<div class="bwrap"><div class="heat">${heat}</div><div class="box"><div class="tray"></div><div class="slices">${sl}</div><div class="front"></div>
      <div class="tag">${left?`เหลือ ${left} ซอง`:'หมดกล่อง'}</div>${BX.length>1?`<span class="box-no">กล่อง ${bx.i+1}/${BX.length}</span>`:''}</div></div>`;
  }).join('');

  let rec='';
  if(UI.sel){
    const x=UI.sel,o=b.opened[x];
    const used=usedNums(b);
    let hb='';
    for(const n of hitList(b)){const cur=o&&val(o)===n;if(used.has(n)&&!cur)continue;
      hb+=`<button class="btn ${cur?'cur':''}" onclick="mark(${x},${n})">★ ${pad(n)}${hitLabel(b,n)?`<small>${esc(hitLabel(b,n))}</small>`:''}</button>`}
    let where,sub='';
    if(o){where=`${boxPrefix(b,boxOf(b,x))}ซองตำแหน่งเดิม #${x} · บันทึกไว้: ${numLabel(b,val(o))}`}
    else{
      const p=lr(b,x);where=`${boxPrefix(b,p.bx)}ซองที่ ${p.L} จากซ้าย · ${p.R} จากขวา`;
      const gp=R.guessP?R.guessP(x):null,g=gp?null:R.guess(x);
      sub=`ตำแหน่งเดิม #${x}${moved(b,x)?' (ซองนี้ถูกย้ายมาเติมจากขวาสุด)':''} · โอกาสฮิต ${pct(R.spread?R.prob[x]:R.base)}${T&&T.out.length?` · เป็นเลขที่ตามล่า ${pct(T.pt[x])}`:''}${EV?` · คุ้ม ${money(EV.ev[x])}`:''}${gp?` · น่าจะเป็นเลข ${gp.map(o=>`${isHitV(b,o.u)?'★':''}${pad(o.u)} (${pct(o.p)})`).join(' · ')}`:g?` · คาดว่าเป็นเลข ${g.nums.map(n=>isHitV(b,n)?'★'+pad(n):pad(n)).join(' / ')}`:''}`;
    }
    rec=`<div class="rec" id="rec"><div class="where">${where}</div>${sub?`<div class="orig">${sub}</div>`:''}
      <div class="row" style="margin-top:12px">

function setSide(s){UI.side=s;const v=$('#posN')?.value;renderBoard('pos');if(v&&$('#posN'))$('#posN').value=v}

function goPos(){

  const bx=boxes(b)[UI.box],r=remainIn(b,bx);
  if(!n||n<1||n>r.length){toast(`ใส่เลข 1–${r.length} (เหลือ ${r.length} ซองใน${boxes(b).length>1?'กล่องนี้':'กล่อง'})`);return}
  UI.sel=UI.side==='R'?r[r.length-n]:r[n-1];UI.pick={x:UI.sel,s:UI.side==='R'?'R':'L'};renderBoard();
}
function saveNum(x){
  const b=getB(S.cur),v=parseInt($('#numIn').value);
  if(!v||v<1||v>NM(b)){toast(`ใส่เลข 1–${NM(b)}`);return}
  const at=usedNums(b).get(v);
  if(at===0){const a=archNums(b).get(v);toast(`เลข ${pad(v)} ออกไปแล้วในรอบก่อน (รอบ ${a.round}) ก่อนร้านสับใหม่`);return}
  if(at!==undefined&&at!==x){toast(`เลข ${pad(v)} บันทึกไว้แล้วที่ซองตำแหน่งเดิม #${at}\nถ้าจดผิด แตะรายการนั้นในช่อง “ออกแล้ว” เพื่อแก้`);return}

function saveSettings(){
  const b=getB(S.cur);b.sec=clamp(parseInt($('#sSec').value)||0,0,100);b.refill=$('#sRefill').checked&&b.sec>0;
  b.boxN=clamp(parseInt($('#sBoxN').value)||0,0,10);b.boxPer=clamp(parseInt($('#sBoxPer').value)||0,0,500);
  const hn=parseNums($('#sHitNums').value,NM(b));if(hn.length){b.hitNums=hn;b.hitCount=hn.length}else b.hitNums=null;
  b.refillAt=document.querySelector('#sheet [data-ra][aria-pressed="true"]')?.dataset.ra||'gap';
  const num=id=>{const v=parseFloat(String($(id).value).replace(/,/g,''));return v>0?v:0};
  b.price=num('#sPrice');b.saltVal=num('#sSalt');b.hitValDef=num('#sHitDef');
  const hvm={};String($('#sHitVals').value||'').split('\n').forEach(l=>{const m=l.replace(/,/g,'').match(/(\d+)\s*[=:\s]\s*([\d.]+)/);if(m){const k=+m[1],v=+m[2];if(k>=1&&k<=NM(b)&&v>=0)hvm[k]=v}});
  b.hitVals=hvm;if(b.rankBy==='ev'&&!evOn(b))b.rankBy='hit';
  UI.sel=null;save();closeSheet();renderBoard('pos');
}

function setRA(v){const b=getB(S.cur);b.refillAt=v;UI.sel=null;save();renderBoard('pos')}
function setMode(v){const b=getB(S.cur);b.mode=v;save();renderBoard()}
function pushLog(b,x){b.log.push({x,prev:b.opened[x]?{...b.opened[x]}:null,seq:seqOf(b).slice(),pred:b.pred&&b.pred[x]?b.pred[x]:null});if(b.log.length>300)b.log.shift()}
function mark(x,v){
  const b=getB(S.cur),seq=seqOf(b);
  let sp=null;if(!b.opened[x]&&!(b.pred&&b.pred[x])){try{sp=snapPred(b,x)}catch(e){sp=null}}
  pushLog(b,x);
  b.opened[x]={v};if(!seq.includes(x))seq.push(x);
  if(sp){if(!b.pred||typeof b.pred!=='object')b.pred={};b.pred[x]=sp}
  UI.pick=null;
  UI.sel=null;save();renderBoard('pos');
}
function unmark(x){
  const b=getB(S.cur),seq=seqOf(b);pushLog(b,x);
  delete b.opened[x];const i=seq.indexOf(x);if(i>=0)seq.splice(i,1);if(b.pred)delete b.pred[x];
  UI.sel=null;save();renderBoard('pos');
}
function undo(){
  const b=getB(S.cur),l=b.log.pop();if(!l)return;
  if(l.rs){Object.assign(b,l.rs);if(!l.rs.numMax)delete b.numMax;if(!l.rs.style)delete b.style;if(!b.archive.length)delete b.archive;UI.sel=null;UI.box=0;save();toast('ย้อนการสับใหม่แล้ว');renderBoard('pos');return}
  if(l.prev)b.opened[l.x]=l.prev;else delete b.opened[l.x];
  if(l.seq)b.seq=l.seq;
  if(!b.pred||typeof b.pred!=='object')b.pred={};if(l.pred)b.pred[l.x]=l.pred;else delete b.pred[l.x];
  UI.sel=null;save();renderBoard('pos');
}
function closeBoard(){
  const b=getB(S.cur),f=foundHitsAll(b).length;
  const msg=f<hitList(b).length?`ยังจดฮิตไม่ครบ (${f}/${hitList(b).length})\nข้อมูลที่จดไว้ยังใช้วิเคราะห์ร้านได้\n\nปิดกระดานเลยไหม?`:'ปิดกระดานและบันทึกเป็นข้อมูลร้าน?';
  ask(msg.replace(/\n/g,'<br>'),'ปิดกระดาน',()=>{b.closed=true;UI.sel=null;save();renderBoard()});
}
function reopen(){const b=getB(S.cur);b.closed=false;save();renderBoard()}
function delBoardId(id){const b=getB(id);if(!b)return;
  ask(`ลบกระดาน “${esc(b.name)}” ถาวร?<br><span class="small muted">ข้อมูลที่จดไว้ในกระดานนี้จะหายจากทุกเครื่อง</span>`,'ลบกระดาน',()=>{S.boards=S.boards.filter(x=>x.id!==id);if(S.cur===id)S.cur=null;save();toast('ลบแล้ว');renderShop()})}
function reopenId(id){const b=getB(id);if(!b)return;b.closed=false;save();renderShop()}
function delBoard(){ask('ลบกระดานนี้ถาวร?','ลบกระดาน',()=>{const sh=getB(S.cur).shop;S.boards=S.boards.filter(b=>b.id!==S.cur);save();openShop(sh)})}

/* ===== sheet / backup ===== */
function openSheet(h){$('#sheet').innerHTML=h;$('#ov').classList.add('on')}
function closeSheet(){$('#ov').classList.remove('on')}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.innerHTML=esc(m).replace(/\n/g,'<br>');t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3200)}
let _ask=null;
function ask(msg,yes,fn){_ask=fn;openSheet(`<h2>ยืนยัน</h2><p style="line-height:1.6">${msg}</p>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="closeSheet()">ยกเลิก</button><button class="btn red" style="flex:1" onclick="closeSheet();_ask&&_ask()">${yes}</button></div>`)}
function exportData(){
  const txt=JSON.stringify(S);
  try{const blob=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='j-hunter-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}
  openSheet(`<h2>สำรองข้อมูล</h2><p class="note">ถ้าไฟล์ไม่ดาวน์โหลดเอง ให้กดคัดลอกข้อความด้านล่าง แล้วไปวางในเครื่องอื่นที่ปุ่ม “วางข้อมูล”</p>
  <textarea class="in" id="expTxt" rows="6" readonly style="font-family:var(--num);font-size:12px">${esc(txt)}</textarea>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="closeSheet()">ปิด</button><button class="btn gold" style="flex:1" onclick="copyExp()">คัดลอกข้อมูล</button></div>`);
}
function copyExp(){const t=$('#expTxt');navigator.clipboard?.writeText(t.value).then(()=>toast('คัดลอกแล้ว'),()=>{t.select();toast('กด Ctrl+C / คัดลอก ได้เลย')})||(t.select(),toast('กด Ctrl+C / คัดลอก ได้เลย'))}
function pasteData(){openSheet(`<h2>วางข้อมูล</h2><p class="note">วางข้อความที่คัดลอกมาจากอีกเครื่อง กระดานที่ยังไม่มีจะถูกเพิ่มเข้ามา</p>
  <textarea class="in" id="impTxt" rows="6" style="font-family:var(--num);font-size:12px"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="closeSheet()">ยกเลิก</button><button class="btn gold" style="flex:1" onclick="mergeData($('#impTxt').value)">นำเข้า</button></div>`)}
function mergeData(txt){try{
    const d=JSON.parse(txt);if(!Array.isArray(d.boards))throw 0;
    const ids=new Set(S.boards.map(b=>b.id));let add=0;
    d.boards.forEach(b=>{if(!ids.has(b.id)){S.boards.push(b);add++}});
    (d.shops||[]).forEach(n=>{if(!shopList().includes(n))S.shops.push(n)});
    save();closeSheet();toast('นำเข้าแล้ว '+add+' กระดาน');renderHome();
  }catch(e){toast('ข้อมูลไม่ถูกต้อง')}}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>mergeData(r.result);
  r.readAsText(f);
}

/* ===== ซิงก์ข้ามเครื่องผ่าน Supabase (ไม่ต้องล็อกอิน ใช้รหัสซิงก์) ===== */
const SB_URL='https://adtrhfenqcbjdzwurdee.supabase.co', SB_KEY='sb_publishable_69WNqfu2SegYkUjipstgvw___XOOSkr';
const SB_OK=/^https:\/\//.test(SB_URL)&&SB_KEY.length>20;
const CODE_KEY='jhunter.sync';
let SPACE=null,CODE=null,synced={},metaSynced=null,lastRev=0,syncState='local',pendingRender=false,_t=null,_chain=Promise.resolve(),_poll=null,_pulling=false;
if(!Array.isArray(S.deleted))S.deleted=[];
const sig=b=>{const {log,ts,...r}=b;return JSON.stringify(r)};
const bodyOf=b=>{const {log,...r}=b;return JSON.parse(JSON.stringify(r))};
const metaOf=()=>({shops:shopList().slice(),deleted:S.deleted.slice(-300)});
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jhunter:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function rpc(fn,body){
  const r=await fetch(SB_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:SB_KEY},/^eyJ/.test(SB_KEY)?{Authorization:'Bearer '+SB_KEY}:{}),body:JSON.stringify(body)});
  if(!r.ok)throw new Error(fn+' '+r.status);return r.json();
}
function setSync(st){syncState=st;paintSync()}
function paintSync(){const el=$('#syncPill');if(!el)return;
  const m={local:[SB_OK?'ซิงก์: ยังไม่ได้ตั้งรหัส':'เก็บในเครื่องนี้','off'],saving:['กำลังซิงก์…','busy'],ok:['ซิงก์แล้ว','ok'],err:['ออฟไลน์ · เก็บในเครื่องไว้ก่อน','off']}[syncState];
  el.textContent=m[0];el.className='sync '+m[1];el.onclick=SB_OK?openSync:null;el.style.cursor=SB_OK?'pointer':''}
function route(){S.cur&&getB(S.cur)?renderBoard():S.shopView?renderShop():renderHome()}
function rerender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.value){pendingRender=true;return}
  if($('#ov')?.classList.contains('on')){pendingRender=true;return}pendingRender=false;route()}
function scheduleSync(){if(!SPACE)return;clearTimeout(_t);_t=setTimeout(()=>{_chain=_chain.then(doPush).catch(()=>setSync('err'))},500)}
async function doPush(){
  let did=false;const mark=()=>{if(!did){setSync('saving');did=true}};
  for(const b of S.boards.slice()){const g=sig(b);if(synced[b.id]===g)continue;mark();
    b.ts=Date.now();await rpc('jh_push',{p_space:SPACE,p_id:b.id,p_data:bodyOf(b),p_ts:b.ts});synced[b.id]=g}
  for(const id of Object.keys(synced)){if(getB(id))continue;mark();
    if(!S.deleted.includes(id))S.deleted.push(id);
    await rpc('jh_push',{p_space:SPACE,p_id:id,p_data:{deleted:true},p_ts:Date.now()});delete synced[id]}
  const m=JSON.stringify(metaOf());
  if(m!==metaSynced){mark();await rpc('jh_push',{p_space:SPACE,p_id:'_meta',p_data:JSON.parse(m),p_ts:Date.now()});metaSynced=m}
  if(did)persist();
  setSync('ok');
}
function applyRows(rows,first){
  let changed=false;
  rows.forEach(r=>{
    lastRev=Math.max(lastRev,+r.rev||0);
    const d=r.data||{};
    if(r.id==='_meta'){
      const pending=metaSynced!==null&&JSON.stringify(metaOf())!==metaSynced;
      const del=new Set([...S.deleted,...(d.deleted||[])]);S.deleted=[...del];
      const nb=S.boards.filter(b=>!del.has(b.id));if(nb.length!==S.boards.length){S.boards=nb;changed=true}
      if(first){const sh=shopList();(d.shops||[]).forEach(n=>{if(!sh.includes(n))sh.push(n)});changed=true}
      else if(!pending){S.shops=(d.shops||[]).slice();shopList();metaSynced=JSON.stringify(metaOf());changed=true}
      return;
    }
    const id=r.id,loc=getB(id);
    if(d.deleted){if(!S.deleted.includes(id))S.deleted.push(id);if(loc){S.boards=S.boards.filter(b=>b!==loc);changed=true}delete synced[id];return}
    if(S.deleted.includes(id))return;
    const g=sig(d);
    if(loc&&sig(loc)===g){synced[id]=g;return}
    if(loc&&synced[id]!==sig(loc)&&(loc.ts||0)>(+r.ts||0))return; // เครื่องนี้แก้ใหม่กว่าและยังไม่ได้ส่ง
    const nb=JSON.parse(JSON.stringify(d));nb.log=loc?.log||[];nb.ts=+r.ts||0;
    if(loc)S.boards[S.boards.indexOf(loc)]=nb;else S.boards.push(nb);
    synced[id]=g;changed=true;
  });
  return changed;
}
async function pull(first){
  if(!SPACE||_pulling)return;_pulling=true;
  try{const rows=await rpc('jh_pull',{p_space:SPACE,p_since:first?0:lastRev});
    const c=applyRows(rows,first);
    if(first){persist();scheduleSync();route()}
    else if(c){persist();rerender()}
    if(syncState!=='saving')setSync('ok');
  }catch(e){setSync('err')}finally{_pulling=false}
}
async function startSync(code){
  if(!SB_OK||!code)return;
  CODE=code;SPACE=await sha(code);synced={};metaSynced=null;lastRev=0;
  setSync('saving');await pull(true);
  clearInterval(_poll);_poll=setInterval(()=>{if(!document.hidden)pull(false)},4000);
}
function newCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(16));return [...r].map(x=>a[x%a.length]).join('').replace(/(.{4})(?=.)/g,'$1-')}
function syncLink(){return location.origin+location.pathname+'#sync='+encodeURIComponent(CODE)}
function openSync(){
  if(!CODE){openSheet(`<h2>ซิงก์ข้ามเครื่อง</h2>
    <p class="note">เครื่องแรก: กด “สร้างรหัสใหม่” · เครื่องอื่น: ใส่รหัสเดียวกัน หรือเปิดลิงก์ซิงก์ที่ได้จากเครื่องแรก</p>
    <button class="btn gold block" style="margin-top:10px" onclick="setCode(newCode())">สร้างรหัสใหม่</button>
    <label class="f">หรือใส่รหัสที่มีอยู่แล้ว</label><input class="in" id="codeIn" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" style="font-family:var(--num)">
    <div class="row" style="margin-top:12px"><button class="btn" onclick="closeSheet()">ปิด</button><button class="btn gold" style="flex:1" onclick="setCode($('#codeIn').value)">ใช้รหัสนี้</button></div>`);return}
  openSheet(`<h2>ซิงก์ข้ามเครื่อง</h2>
    <p class="note">เปิดลิงก์นี้ในเครื่องอื่นครั้งเดียว เครื่องนั้นจะซิงก์ตามเลย เก็บรหัสนี้เป็นความลับ ใครมีรหัสจะเห็นข้อมูลนี้</p>
    <label class="f">รหัสซิงก์</label><input class="in" id="codeShow" readonly value="${esc(CODE)}" style="font-family:var(--num);font-weight:700;letter-spacing:1px">
    <label class="f">ลิงก์ซิงก์</label><input class="in" id="linkShow" readonly value="${esc(syncLink())}" style="font-size:13px">
    <div class="row" style="margin-top:12px"><button class="btn gold" style="flex:1" onclick="copyText('linkShow')">คัดลอกลิงก์</button><button class="btn" onclick="copyText('codeShow')">คัดลอกรหัส</button></div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="closeSheet()">ปิด</button><button class="btn red sm" onclick="ask('เลิกซิงก์เครื่องนี้? ข้อมูลในเครื่องยังอยู่ และข้อมูลออนไลน์ไม่ถูกลบ','เลิกซิงก์',()=>{lsSet(CODE_KEY,null);location.reload()})">เลิกซิงก์เครื่องนี้</button></div>`);
}
function copyText(id){const t=$('#'+id);const done=()=>toast('คัดลอกแล้ว');try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();document.execCommand('copy');done()})}catch(e){t.select();document.execCommand('copy');done()}}
async function setCode(c){c=String(c||'').trim().toUpperCase().replace(/\s+/g,'');if(c.replace(/-/g,'').length<12){toast('รหัสสั้นเกินไป');return}
  lsSet(CODE_KEY,c);closeSheet();await startSync(c);openSync()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(SPACE)pull(false);if(pendingRender)rerender()}});
(function bootSync(){
  const m=location.hash.match(/sync=([^&]+)/);
  if(m){lsSet(CODE_KEY,decodeURIComponent(m[1]).toUpperCase());history.replaceState(null,'',location.pathname+location.search)}
  const c=lsGet(CODE_KEY);if(c&&SB_OK)startSync(c);
})();
S.cur&&getB(S.cur)?renderBoard('pos'):S.shopView?renderShop():renderHome();
paintSync();

</script>
